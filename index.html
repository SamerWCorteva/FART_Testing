.brand { font-family:'D-DIN','DIN Alternate','Bahnschrift','DIN 1451 Std',system-ui,sans-serif; line-height:1.05; }
.searchrow { display:flex; gap:10px; align-items:stretch; margin-bottom:14px; }
.search { flex:1; position:relative; display:block; margin:0; min-width:0; }
.search input[type=text] { padding-left:2.6rem; }
.search::before { content:''; position:absolute; left:.85rem; top:50%; width:1.05rem; height:1.05rem; transform:translateY(-50%); pointer-events:none;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23788596' stroke-width='2.4' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>") no-repeat center / contain; }
.searchrow button { flex:none; white-space:nowrap; }
.sec > summary { display:flex; align-items:center; gap:8px; cursor:pointer; list-style:none; font-size:1.05rem; font-weight:700; }
.sec > summary::-webkit-details-marker { display:none; }
.sec > summary::before { content:'▸'; color:var(--accent); }
.sec[open] > summary::before { content:'▾'; }
.sec-name { flex:1; }
.sec-btns { display:flex; gap:8px; align-items:center; margin-left:auto; }
.icon-btn { min-height:32px; width:32px; padding:0; border-radius:8px; }
.tc-link { display:block; color:inherit; text-decoration:none; }
.trial-card .mv { display:flex; align-items:center; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
.trial-card .mv select { width:auto; min-height:36px; flex:1; }
a.brand, .brand-link { color:inherit; text-decoration:none; }
.brand-link { display:block; }
.crow { display:grid; grid-template-columns:1.25fr .8fr .8fr 58px 34px; gap:6px; align-items:center; margin-bottom:6px; }
.crow.chead { font-size:.75rem; font-weight:700; color:var(--muted); margin-bottom:2px; }
.crow input[type=text], .crow input:not([type]) { min-height:42px; padding:.3rem .4rem; text-align:center; }
.crow input.err { border-color:var(--bad); background:var(--bad-soft); }
.crow input:disabled { background:var(--line); }
.crow .chk { justify-content:center; }
.map .pc.buf { background:repeating-linear-gradient(135deg, var(--bg), var(--bg) 5px, var(--line) 5px, var(--line) 6px); }
.map .pc.buf span { font-style:italic; }
/* subtle tints that show which plots belong to which rep (custom randomization only) */
:root { --rep1:#e6f0fb; --rep2:#e8f5ec; --rep3:#f3ebf9; --rep4:#fdf1de; --rep5:#e3f4f3; --rep6:#fbe8ed; }
@media (prefers-color-scheme: dark) { :root { --rep1:#1a2a3d; --rep2:#17291f; --rep3:#2a1f34; --rep4:#33281a; --rep5:#16302e; --rep6:#331d25; } }
:root[data-contrast] { --rep1:#d3e5f8; --rep2:#d4eddc; --rep3:#e6d8f3; --rep4:#fbe3b8; --rep5:#cdebe9; --rep6:#f6d3dc; }
.rp1 { --rc:var(--rep1); } .rp2 { --rc:var(--rep2); } .rp3 { --rc:var(--rep3); } .rp4 { --rc:var(--rep4); } .rp5 { --rc:var(--rep5); } .rp6 { --rc:var(--rep6); }
.map .pc[class*="rp"] { background-color:var(--rc); }
.map .pc.utc[class*="rp"] { background-image:linear-gradient(rgba(60,80,110,.2), rgba(60,80,110,.2)); outline:1.5px solid var(--utc-line); }
.rand input[class*="rp"] { background:var(--rc); }
.replegend { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.rl { display:inline-block; padding:.1rem .6rem; border-radius:999px; font-size:.78rem; border:1px solid var(--line); background:var(--rc); }
.review tr.setrow td { background:var(--bg); font-weight:700; text-align:left; padding:.4rem .5rem; }
.setname { font-weight:700; margin:12px 0 4px; }
.seg { display:flex; gap:6px; margin:4px 0 12px; }
.seg button { flex:1; min-height:42px; }
.seg button.on { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
.rand input.buf { background:repeating-linear-gradient(135deg, var(--bg), var(--bg) 5px, var(--line) 5px, var(--line) 6px); }
.datewrap { position:relative; display:block; }
.datewrap input { padding-right:3.2rem; }
.calbtn { position:absolute; right:4px; top:50%; transform:translateY(-50%); min-height:36px; width:40px; padding:0; border:0; background:transparent; color:var(--accent); border-radius:8px; }
.cal-ov { align-items:center; }
.sheet.cal { max-width:340px; border-radius:var(--radius); padding:14px; margin:0 16px; border:1px solid var(--line); }
.cal-head { display:flex; gap:6px; align-items:center; margin-bottom:10px; }
.cal-head select { flex:1; min-height:40px; padding:.3rem .5rem; width:auto; min-width:0; }
.cal-head select[data-sel="y"] { flex:.7; }
.sheet.cal .calnav { width:40px; min-height:40px; padding:0; font-size:1.4rem; flex:none; }
.sheet.cal button { width:auto; margin:0; }
.cal-grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; text-align:center; }
.cal-wd { font-size:.72rem; font-weight:700; color:var(--muted); padding:4px 0; }

<body>
<div id="app"></div>
<div id="toast"></div>
<div id="kbbar" aria-label="Move between boxes">
  <button type="button" data-d="left" tabindex="-1" aria-label="Previous">◀</button>
  <button type="button" data-d="up" tabindex="-1" aria-label="Up">▲</button>
  <button type="button" data-d="down" tabindex="-1" aria-label="Down">▼</button>
  <button type="button" data-d="right" tabindex="-1" aria-label="Next">▶</button>
  <button type="button" data-d="done" class="done" tabindex="-1">Done</button>
</div>
<script>
'use strict';
const APP_VERSION = 42;
// keep APP_VERSION in step with VERSION in sw.js
const cap = s => { s = String(s ?? ''); return s.charAt(0).toUpperCase() + s.slice(1); }; // first letter capital, used for titles and headers
/* ---------- storage ---------- */
const KEY = 'fieldAssessments.v1';
const app = document.getElementById('app');
// when this device last got a new version of the app (kept apart from trial data, so it is not part of backups)
const APPINFO_KEY = 'fieldAssessments.app';
let appInfo = (() => {
  try { const x = JSON.parse(localStorage.getItem(APPINFO_KEY) || '{}'); if (x.version !== APP_VERSION) { x.version = APP_VERSION; x.installedAt = Date.now(); localStorage.setItem(APPINFO_KEY, JSON.stringify(x)); } return x; }
  catch (e) { return { version: APP_VERSION, installedAt: Date.now() }; }
})();
let db = loadDB();
let homeQuery = ''; // the text in the home page search box
function applyContrast() { document.documentElement.toggleAttribute('data-contrast', !!db.settings.contrast); }
applyContrast();

function migrateDb(d) { // keeps older data and backups working
  d.trials.forEach(t => {
    if (t.crop) t.crop = t.crop.replace('(BRSNN)', '(BRSNW)');
    t.trialId = String(t.trialId || '').toUpperCase();
    (t.assessments || []).forEach(a => { if (a.assessor) a.assessor = String(a.assessor).toUpperCase(); });
    if (t.randType === 'custom' && Array.isArray(t.plotList) && t.plotList.some(p => p.row == null)) {
      const reps = [...new Set(t.plotList.map(p => p.rep))].sort((x, y) => x - y), seenN = {};
      t.plotList.forEach(p => { const r = reps.indexOf(p.rep) + 1; seenN[r] = (seenN[r] || 0) + 1; p.row = r; p.col = seenN[r]; });
      t.plotList.sort((x, y) => x.row - y.row || x.col - y.col);
      t.grid = { across: Math.max(...Object.values(seenN)), up: reps.length };
    }
    if (t.randType === 'custom' && Array.isArray(t.plotList)) { t.plotList.forEach(p => { if (p.set == null) p.set = 0; }); if (!t.sets || !t.sets.length) t.sets = [{ name: '', grid: t.grid }]; }
    (t.assessments || []).forEach(a => (a.types || []).forEach(ty => { if (ty.sizeL !== undefined) { if (ty.sizeH === undefined) ty.sizeH = ty.sizeL; delete ty.sizeL; } }));
  });
  if (d.settings && d.settings.assessor) d.settings.assessor = String(d.settings.assessor).toUpperCase();
  return d;
}
function loadDB() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) { const d = JSON.parse(s); d.trials = d.trials || []; d.sections = d.sections || []; d.settings = d.settings || {}; d.drafts = d.drafts || {}; d.signatures = d.signatures || {}; return migrateDb(d); }
  } catch (e) {}
  return { trials: [], sections: [], settings: { showTrt: false }, drafts: {}, signatures: {} };
}
function doBackup() {
  const ts = Date.now(), json = JSON.stringify(db, null, 1);
  db.settings.lastBackup = ts; db.trials.forEach(tr => tr.assessments.forEach(x => { x.backedUpAt = ts; })); save();
  download(new Blob([json], { type: 'application/json' }), `field-assessments-backup_${dmy(today()).replace(/\//g, '-')}.json`);
  toast('Backup saved');
}
const plotSizeTxt = t => (t.plotL || t.plotW) ? `${t.plotL || '–'} m × ${t.plotW || '–'} m` : ''; // plot length × width
const trialLine = t => `${t.reps} Reps × ${t.trts} Treatments${appLetters(t).length ? ` × ${appLetters(t).length} Application${appLetters(t).length === 1 ? '' : 's'}` : ''} · ${plotCount(t)} Plots`;
const secOpts = sel => `<option value="">None (Other trials)</option>${db.sections.map(sc => `<option value="${sc.id}" ${sel === sc.id ? 'selected' : ''}>${esc(sc.name)}</option>`).join('')}`;
const fmtDT = ts => { const x = new Date(ts), z = n => String(n).padStart(2, '0'); return `${z(x.getDate())}/${z(x.getMonth() + 1)}/${x.getFullYear()} ${z(x.getHours())}:${z(x.getMinutes())}`; };
function save() {
  db.settings.lastSaved = Date.now(); // shown on the home screen as the last update
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch (e) { toast('Could not save on this device. Export a backup now.'); return false; }
}

/* ---------- drafts: forms are saved at every step, so nothing typed is lost ---------- */
function persistQuiet() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} } // does not change "Last update"
let draftTimer = null, draftPending = null;
function queueDraft(key, make) { // make() builds {data, step}; waits a moment so fast typing is saved once
  draftPending = { key, make }; clearTimeout(draftTimer); draftTimer = setTimeout(flushDraft, 350);
}
function flushDraft() {
  clearTimeout(draftTimer); const p = draftPending; draftPending = null; if (!p) return;
  const r = p.make(); if (!r) return;
  db.drafts[p.key] = { data: r.data, step: r.step, saved: Date.now() }; persistQuiet();
}
const getDraft = key => (db.drafts || {})[key] || null;
function dropDraft(key) { if (draftPending && draftPending.key === key) { draftPending = null; clearTimeout(draftTimer); } if (db.drafts && db.drafts[key]) { delete db.drafts[key]; persistQuiet(); } }
function dropTrialDrafts(id) { Object.keys(db.drafts || {}).forEach(k => { if (k === 'trial:' + id || k.startsWith('assess:' + id + ':')) dropDraft(k); }); }
function savedAgo(ts) {
  const m = Math.floor((Date.now() - ts) / 6e4);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.floor(m / 60)} h ago` : fmtDT(ts);
}
window.addEventListener('pagehide', flushDraft);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushDraft(); });

/* ---------- signature (kept on this device; stamped on every assessment made here) ---------- */
const deviceId = () => db.settings.deviceId || (db.settings.deviceId = uid() + uid());
const mySig = () => (db.signatures || {})[db.settings.signatureId] || null;
function stampAssessment(a) { a.device = deviceId(); a.sigId = db.settings.signatureId || null; }
function sigOf(a) { // the signature that goes on an assessment's exports
  if (a && a.sigId && db.signatures[a.sigId]) return db.signatures[a.sigId];
  if (a && a.device && a.device !== db.settings.deviceId) return null;
  return mySig();
}
const sigsFor = list => { const o = {}; list.forEach(a => { if (a && a.sigId && db.signatures[a.sigId]) o[a.sigId] = db.signatures[a.sigId]; }); return o; };
const adoptSigs = sigs => { Object.values(sigs || {}).forEach(sg => { if (sg && sg.id && sg.png && !db.signatures[sg.id]) db.signatures[sg.id] = sg; }); };
function setSignature(sg) { // sg = a new signature, or null to remove this device's signature
  const old = db.settings.signatureId, me = deviceId();
  if (sg) { db.signatures[sg.id] = sg; db.settings.signatureId = sg.id; } else delete db.settings.signatureId;
  db.trials.forEach(t => t.assessments.forEach(a => { if (!a.device || a.device === me) { a.device = me; a.sigId = sg ? sg.id : null; } }));
  if (old && (!sg || old !== sg.id) && !db.trials.some(t => t.assessments.some(a => a.sigId === old))) delete db.signatures[old];
  save();
}

/* ---------- helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
function num(s) {
  s = String(s ?? '').trim().replace(',', '.');
  if (s === '') return null;
  const n = Number(s);
  return isFinite(n) ? n : null;
}
const round = (n, d = 2) => n == null ? null : Math.round(n * 10 ** d) / 10 ** d;
const fmt = (n, d = 2) => n == null ? '–' : String(round(n, d));
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
function sd(a) { if (a.length < 2) return null; const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); }
const dmy = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso || ''); };
function parseDmy(str) { // DD/MM/YYYY (also accepts - . and 2-digit years) -> YYYY-MM-DD, or '' if not a real date
  const m = /^\s*(\d{1,2})[\/.\-\s](\d{1,2})[\/.\-\s](\d{2}|\d{4})\s*$/.exec(str || ''); if (!m) return '';
  const y = m[3].length === 2 ? 2000 + +m[3] : +m[3], mo = +m[2], da = +m[1], dt = new Date(y, mo - 1, da);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== da) return '';
  return `${y}-${String(mo).padStart(2, '0')}-${String(da).padStart(2, '0')}`;
}
const range = n => Array.from({ length: n }, (_, i) => i + 1);
let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400); }
const go = h => { location.hash = h; };
const goReplace = h => { location.replace(h); };

/* ---------- lists: trial types, assessment menus, crops, weeds ---------- */
const TRIAL_TYPES = ['Fungicide', 'Herbicide', 'Biostimulant', 'SAT (Seed Applied Treatment)', 'BioFungicide', 'Insecticide', 'Growth Regulator (PGR)'];
const FUNG_PESTS = [
  ['Wheat', [['SEPTTR', 'Septoria'], ['PUCCST', 'Yellow Rust'], ['PUCCRT', 'Brown Rust'], ['ERYSGR', 'Powdery Mildew'], ['FUSASP', 'Fusarium']]],
  ['Barley', [['RHYNSE', 'Rhynchosporium'], ['PYRNTE', 'Net Blotch'], ['RAMUCC', 'Ramularia'], ['PUCCHD', 'Brown Rust'], ['ERYSGH', 'Powdery Mildew']]],
  ['OSR', [['LEPTMA', 'Phoma'], ['PYRNLI', 'Light Leaf Spot'], ['SCLESC', 'Sclerotinia']]],
];
const SAT_PESTS = [['SAT pests', [['USTINH', 'Loose Smut'], ['FUSASP', 'Fusarium spp.'], ['MONGNI', 'Microdochium Seedling Blight'], ['BYDV00', 'BYDV'], ['SEPTTR', 'Septoria'], ['ERYSGR', 'Powdery Mildew'], ['PUCCST', 'Yellow Rust'], ['RHYNSE', 'Rhynchosporium'], ['PYRNTE', 'Net Blotch'], ['RAMUCC', 'Ramularia']]]];
const PEST_CODES = ['Mixed', 'LESVIS', 'PYCVIS', 'PUSVIS']; // pest stage choices for fungicide trials
const LEAVES = ['Leaf 1', 'Leaf 2', 'Leaf 3', 'Leaf 4', 'Leaf 5', 'Leaf 6', 'Ear']; // 'leaf level' for fungicide assessments
// n=name u=unit min/max  tg=needs a weed/pest  leaf=needs leaf level  untr=untreated plots only
const PH = { u: '%', min: 0, max: 100, phyto: 1 };
const MENUS = [

  if (!Object.keys(r).length) delete a.data[plot];
  return m;
}
const plotStarted = (a, plot) => isNA(a, plot) || a.types.some(ty => rawVal(a, plot, ty.id) !== '');
const countDone = (t, a) => scopedPlots(t, a).filter(p => plotComplete(t, a, p.plot)).length;
function firstIncomplete(t, a) { const w = walkOrder(t, a); const i = w.findIndex(p => !plotComplete(t, a, p.plot)); return i < 0 ? 0 : i; }
function outOfRange(ty, raw) {
  if (raw === '' || raw === 'NA') return '';
  const n = num(raw);
  if (n == null) return 'warn';
  if ((ty.min !== '' && ty.min != null && n < Number(ty.min)) || (ty.max !== '' && ty.max != null && n > Number(ty.max))) return 'bad';
  return '';
}
const typeTitle = ty => cap([ty.name, ty.target, ty.leaf, ty.untreatedOnly ? 'Untreated' : ''].filter(Boolean).join(' – '));
const typeLabel = ty => typeTitle(ty) + (ty.unit ? ` (${ty.unit})` : '');
function typeStats(t, a, ty, si) {
  const groups = {};
  range(t.trts).forEach(k => groups[k] = { vals: [], nums: [] });
  scopedPlots(t, a).forEach(p => {
    if (si != null && (p.set || 0) !== si) return;
    const g = groups[p.trt]; if (!g) return;
    const raw = val(a, p.plot, ty.id); const n = num(raw);
    g.vals.push({ ...p, raw, n }); if (n != null) g.nums.push(n);
  });
  let ss = 0, df = 0;
  Object.values(groups).forEach(g => {
    g.mean = mean(g.nums); g.sd = sd(g.nums); g.n = g.nums.length;
    g.cv = (g.sd != null && g.mean) ? g.sd / Math.abs(g.mean) * 100 : null;
    if (g.n > 1) { g.nums.forEach(x => ss += (x - g.mean) ** 2); df += g.n - 1; }
  });
  const pooled = df > 0 ? Math.sqrt(ss / df) : null;
  // Leave-one-out check: compare each value with the other reps of its treatment,
  // using the within-treatment spread measured without that value.
  Object.values(groups).forEach(g => {
    const gss = g.n > 1 ? g.nums.reduce((s, x) => s + (x - g.mean) ** 2, 0) : 0;
    const gdf = Math.max(g.n - 1, 0);
    g.vals.forEach(v => {
      v.outlier = false;
      if (v.n == null || g.n < 2) return;
      const others = g.nums.slice(); others.splice(others.indexOf(v.n), 1);
      const m = others.length, om = mean(others);
      const oss = m > 1 ? others.reduce((s, x) => s + (x - om) ** 2, 0) : 0;
      const ldf = df - gdf + Math.max(m - 1, 0), lss = ss - gss + oss;
      if (ldf < 1) return;
      const s = Math.sqrt(lss / ldf);
      v.outlier = s > 0 ? Math.abs(v.n - om) > 3 * s * Math.sqrt(1 + 1 / m) : v.n !== om;
    });
  });
  return { groups, pooled };
}
