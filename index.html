    if (bad.length) alert(`Some entries did not fit or were not numbers: ${bad.slice(0, 6).join(', ')}${bad.length > 6 ? '…' : ''}`); else toast('Pasted');
  };
  $('f-serp').onchange = () => { d.serpentine = $('f-serp').checked; };
  $('r-clear').onclick = () => { if (!confirm('Clear every plot in the randomization?')) return; d.layout = blankLayout(d.reps, d.trts); drawRand(); $('rand').querySelector('input:not(.sentinel)').focus(); };
  $('paste-go').onclick = () => {
    const N = d.reps * d.trts;
    const lines = $('paste').value.split(/\r?\n/).map(l => l.trim()).filter(l => l && /\d/.test(l));
    const nums = $('paste').value.split(/[\s,;]+/).filter(Boolean).map(Number);
    // Two columns per line (plot number, treatment) — e.g. copied from a protocol table
    const pairs = lines.map(l => l.split(/[\s,;]+/).filter(Boolean).map(Number));
    if (pairs.length === N && pairs.every(p => p.length === 2 && p.every(Number.isInteger))) {
      const map = new Map(pairs.map(([pl, k]) => [pl, k]));
      const missing = [];
      const lay = range(d.reps).map((_, r) => range(d.trts).map((_, i) => {
        const pl = plotNo(d, r, i); if (!map.has(pl)) missing.push(pl); return map.get(pl) ?? '';
      }));
      if (missing.length) { alert(`These plot numbers weren't in the pasted list: ${missing.slice(0, 10).join(', ')}${missing.length > 10 ? '…' : ''}. Check the plot numbering setting above.`); return; }
      d.layout = lay; drawRand(); toast('Randomization applied'); return;
    }
    if (nums.length !== N || nums.some(n => !Number.isInteger(n))) {
      alert(`Expected ${N} treatment numbers (${d.reps} reps × ${d.trts} treatments), or ${N} lines of "plot  treatment", but found ${nums.length} numbers.`); return;
    }
    d.layout = range(d.reps).map((_, r) => nums.slice(r * d.trts, (r + 1) * d.trts));
    drawRand(); toast('Randomization applied');
  };
  $('save').onclick = () => {
    d.trialId = $('f-id').value.trim().toUpperCase(); d.desc = $('f-desc').value.trim();
    d.type = $('f-type').value; d.plotL = $('f-plotl').value.trim().replace(',', '.'); d.plotW = $('f-plotw').value.trim().replace(',', '.');
    d.crop = $('f-crop').value === '__other' ? $('f-crop-other').value.trim() : $('f-crop').value;
    if (!d.trialId) { alert('Please enter a Trial ID.'); $('f-id').focus(); return; }
    if (db.trials.some(t => t.id !== d.id && t.trialId.toLowerCase() === d.trialId.toLowerCase()) && !confirm(`A trial called "${d.trialId}" already exists. Save anyway?`)) return;
    const L = appLetters(d);
    d.trtApps = range(d.trts).map(k => Number(d.untreated) === k ? [] : (d.trtApps[k - 1] || []).filter(l => L.includes(l)).sort());
    if (L.length) {
      const none = range(d.trts).filter(k => Number(d.untreated) !== k && !d.trtApps[k - 1].length);
      if (none.length && !confirm(`Treatment${none.length > 1 ? 's' : ''} ${none.join(', ')} ${none.length > 1 ? 'have' : 'has'} no application ticked.\n\nSave anyway?`)) { showStep(2); return; }
    }
    if (custom()) {
      d.sets.forEach(x => { if (!x.grid) x.grid = gridFromList(d.sets.indexOf(x)); });
      const sts = d.sets.map(x => statusOf(x.grid));
      if (sts.every(x => x.total - x.bufs < 1)) { showStep(3); alert('Fill in the custom randomization first – at least one plot that is not a buffer.'); return; }
      const badIdx = sts.findIndex(x => x.bad);
      if (badIdx >= 0) {
        const st = sts[badIdx]; cur = badIdx; layer = st.errCount.plot ? 'plot' : st.errCount.trt ? 'trt' : 'rep'; showStep(3); drawGrid();
        alert(`${d.sets.length > 1 ? `"${d.sets[badIdx].name || 'Set ' + (badIdx + 1)}": ` : ''}some boxes still need filling in (Plot no.: ${st.errCount.plot}, Treatment: ${st.errCount.trt}, Rep: ${st.errCount.rep}). Every plot needs a different plot number and a treatment from 1 to ${d.trts} (or 0 for a buffer).`); return;
      }
      const warns = sts.flatMap((x, i) => x.warn.map(w => (d.sets.length > 1 ? `${d.sets[i].name || 'Set ' + (i + 1)}: ` : '') + w));
      if (warns.length && !confirm(`${warns.slice(0, 5).join('\n')}${warns.length > 5 ? '\n…' : ''}\n\nSave anyway? (If a treatment appears twice in a rep, the Review table only lists the first of those plots.)`)) return;
      const before = trial && trial.plotList ? JSON.stringify(trial.plotList) : '';
      const list = [];
      d.sets.forEach((x, si) => x.grid.cells.forEach((row, r) => row.forEach((cell, c) => list.push({ plot: Number(cell.plot), rep: cell.buf ? (Number(cell.rep) || 0) : Number(cell.rep), trt: cell.buf ? 0 : Number(cell.trt), row: r + 1, col: c + 1, set: si }))));
      d.plotList = list; d.sets = d.sets.map(x => ({ name: x.name.trim(), grid: { across: x.grid.across, up: x.grid.up } })); delete d.grid;
      d.reps = Math.max(1, ...list.filter(p => p.trt > 0).map(p => p.rep)); // reps are whatever was worked out
      if (locked && before !== JSON.stringify(d.plotList) && !confirm('This trial has data. Changing the plots will re-assign existing plot data. Continue?')) return;
    } else {
      const sts = d.layout.map(row => repStatus(row, d.trts));
      if (sts.some(s => s.blanks || s.bad)) { alert('Every plot needs a treatment number between 1 and ' + d.trts + '.'); return; }
      if (sts.some(s => !s.ok) && !confirm('Some reps do not contain each treatment exactly once. Save anyway?')) return;
      if (locked && JSON.stringify(trial.layout) !== JSON.stringify(d.layout) && !confirm('This trial has data. Changing the randomization will re-assign existing plot data to the new treatments. Continue?')) return;
      d.layout = d.layout.map(row => row.map(Number));
      delete d.plotList; delete d.grid; delete d.sets;
    }
    d.untreated = Number(d.untreated) || 0;
    d.trtNames = range(d.trts).map(k => (d.trtNames[k - 1] || '').trim());
    d.updated = Date.now();
    const i = db.trials.findIndex(t => t.id === d.id);
    if (i >= 0) db.trials[i] = d; else db.trials.push(d);
    finished = true; dropDraft(key);
    save(); toast(editing ? 'Trial saved' : 'Trial created');
    go('#/trial/' + d.id);
  };
  function goStep(n) {
    if (n > 1 && !$('f-id').value.trim()) { alert('Please enter a Trial ID first.'); showStep(1); $('f-id').focus(); return; }
    if (n > 1) resize();
    showStep(n);
    if (n === 3 && !custom()) { const e = [...$('rand').querySelectorAll('input:not(.sentinel)')].sort((x, y) => (+x.dataset.r - +y.dataset.r) || (+x.dataset.i - +y.dataset.i)).find(x => x.value === ''); if (e) e.focus(); }
  }
  app.querySelectorAll('.step').forEach(b => b.onclick = () => goStep(+b.dataset.st));
  $('w-next').onclick = () => goStep(step + 1);
  $('w-back').onclick = () => goStep(step - 1);
  /* drafts: the form is saved at every input or tap, with the step you were on */
  let finished = false;
  const collect = () => { d.plotL = $('f-plotl').value.trim(); d.plotW = $('f-plotw').value.trim(); d.trialId = $('f-id').value.trim().toUpperCase(); d.desc = $('f-desc').value; d.type = $('f-type').value; d.crop = $('f-crop').value === '__other' ? $('f-crop-other').value.trim() : $('f-crop').value; };
  const snap = () => {
    if (finished || !$('f-id')) return null; // the form is already gone
    collect(); if (!editing && !d.trialId && !d.desc.trim()) return null; // nothing worth keeping yet
    const { assessments, ...rest } = d;
    return { data: { d: JSON.parse(JSON.stringify(rest)), ui: { cur, layer } }, step };
  };
  ['input', 'change', 'click'].forEach(ev => app.querySelector('main').addEventListener(ev, e => { if (!finished && !(e.target.closest && e.target.closest('#w-cancel'))) queueDraft(key, snap); }));
  $('w-cancel').onclick = () => {
    const dirty = !!getDraft(key) || (draftPending && draftPending.key === key);
    if (dirty && !confirm(editing ? 'Discard your changes to this trial?' : 'Discard this unfinished trial? Everything you entered will be lost.')) return;
    finished = true; dropDraft(key); go(editing ? '#/trial/' + d.id : '#/');
  };
  drawNames(); drawRand(); applyMode(); showStep(draft && draft.step ? draft.step : 1);
  if (!editing && !draft) $('f-id').focus();
}

/* ---------- TRIAL DETAIL ---------- */
function viewTrial(t) {
  const as = [...t.assessments].sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.created - a.created);
  const trDraft = getDraft('trial:' + t.id), newDraft = getDraft(`assess:${t.id}:new`);
  app.innerHTML = `
  <header class="top"><a class="back" href="#/">← Trials</a><h1>${esc(t.trialId)}</h1><a class="brand sm" href="#/" aria-label="FART – back to the home page"><b>FART</b><span>Field Assessment Recording Tool</span></a></header>
  <main>
    ${t.desc ? `<p class="muted">${esc(t.desc)}</p>` : ''}
    ${(t.type || t.crop || t.archived) ? `<div class="pills" style="margin:0 0 .5rem">${t.archived ? '<span class="pill warn">Archived</span>' : ''}${t.type ? `<span class="pill">${esc(t.type)}</span>` : ''}${t.crop ? `<span class="pill">${esc(t.crop)}</span>` : ''}</div>` : ''}
    <p class="small muted">${trialLine(t)}${plotSizeTxt(t) ? ` · Plot Size ${plotSizeTxt(t)} (L × W)` : ''} · ${t.serpentine ? 'Serpentine Walk' : 'Walk in Plot Order'}</p>
    ${trDraft ? `<div class="card draftcard"><h3>Unsaved Changes to This Trial</h3><div class="small">Saved ${savedAgo(trDraft.saved)}</div>
      <div class="actions" style="margin:10px 0 0"><a class="btn primary small" href="#/trial/${t.id}/edit">Continue</a><button class="small" id="dr-trial-x" type="button">Discard</button></div></div>` : ''}
    ${newDraft ? `<div class="card draftcard"><h3>Unfinished Assessment Date</h3><div class="small">${esc(newDraft.data.dateTxt || dmy(newDraft.data.d.date))} · Saved ${savedAgo(newDraft.saved)}</div>
      <div class="actions" style="margin:10px 0 0"><a class="btn primary small" href="#/trial/${t.id}/a/new">Continue</a><button class="small" id="dr-assess-x" type="button">Discard</button></div></div>` : ''}
    <div class="actions">
      <a class="btn primary" href="#/trial/${t.id}/a/new">+ New Assessment Date</a>
      <button id="xl" ${t.assessments.length ? '' : 'disabled'}>Export All…</button>
      <button id="share">Share Trial</button>
      <button id="copy-trial">Copy Trial</button>
      <label class="btn">Import Assessment<input type="file" class="import-assess" accept=".json,application/json" hidden></label>
      <a class="btn" href="#/trial/${t.id}/edit">Edit Trial</a>
      <button id="arch">${t.archived ? 'Unarchive' : 'Archive Trial'}</button>
    </div>

    <h2 style="margin:20px 0 4px">Assessment Dates</h2>
    <p class="small muted" style="margin-bottom:12px">Add a date, describe the assessments for it, then start assessing.</p>
    ${as.length ? as.map(a => {
      const n = nPlots(t, a), done = countDone(t, a);
      const miss = a.types.length ? visitMissing(t, a) : 0, started = a.types.length > 0 && (done > 0 || scopedPlots(t, a).some(p => plotStarted(a, p.plot)));
      const status = !a.types.length ? ['No Assessments Yet', '', 'new'] : miss === 0 ? ['✓ Complete', 'ok', 'complete'] : started ? ['In Progress', '', 'part'] : ['Not Started', '', 'new'];
      const canLock = a.locked || (a.types.length && miss === 0), unsaved = getDraft(`assess:${t.id}:${a.id}`);
      return `<section class="card visit ${status[2]}">
        <div class="vhead">
          <div><div class="vdate">${esc(dmy(a.date))}</div>
            <div class="small muted">${[a.assessor, stageText(t, a) ? `BBCH ${stageText(t, a)}` : ''].filter(Boolean).map(esc).join(' · ')}</div></div>
          <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center"><span class="pill ${status[1]}">${status[0]}</span><button class="ibtn" data-cmt="${a.id}" type="button" title="Trial comment" aria-label="Trial comment for this date">${ICON.comment}${a.comment ? '<i class="dotmark"></i>' : ''}</button>${canLock ? `<button class="ibtn" data-${a.locked ? 'unlock' : 'lock'}="${a.id}" title="${a.locked ? 'Locked – tap to unlock' : 'Lock this date'}" aria-label="${a.locked ? 'Unlock this date' : 'Lock this date'}" type="button">${a.locked ? ICON.lock : ICON.unlock}</button>` : ''}</span>
        </div>
        ${(appLetters(t).length || unsaved || cropsPill(t, a)) ? `<div class="pills" style="margin:0 0 .5rem">${appLetters(t).length ? `<span class="pill">${esc(scopeText(t, a))}</span>` : ''}${cropsPill(t, a)}${unsaved ? '<span class="pill warn">Unsaved Changes</span>' : ''}</div>` : ''}
        ${a.types.length ? `<div class="bar"><div style="width:${n ? done / n * 100 : 0}%"></div></div>
          <div class="small muted">${done} of ${n} Plots Complete${miss ? ` · ${miss} Value${miss === 1 ? '' : 's'} Still to Enter` : ''}</div>
          <details class="vlist"><summary>${a.types.length} Assessment${a.types.length === 1 ? '' : 's'}</summary>
            <ol>${a.types.map(ty => `<li>${esc(typeLabel(ty))}</li>`).join('')}</ol></details>` : ''}
        <div class="actions" style="margin:12px 0 0">
          <a class="btn primary" href="#/trial/${t.id}/a/${a.id}${a.types.length && miss === 0 ? '/review' : ''}">${!a.types.length ? 'Add Assessments' : miss === 0 ? 'Open' : started ? 'Continue' : 'Start Assessing'}</a>
          <a class="btn" href="#/trial/${t.id}/a/${a.id}/review">Review</a>
          <button data-xp="${a.id}">Export</button>
          <button data-sh="${a.id}">Share</button>
          ${a.locked ? '' : `<a class="btn" href="#/trial/${t.id}/a/${a.id}/edit">Edit</a>`}
        </div>
        ${a.locked ? '' : `<div class="vfoot"><button class="ibtn danger" data-del="${a.id}" title="Delete this date" aria-label="Delete this date" type="button">${ICON.trash}</button></div>`}
      </section>`;
    }).join('') : `<div class="card empty"><p>No assessment dates yet.</p><a class="btn primary" href="#/trial/${t.id}/a/new">+ New Assessment Date</a></div>`}

    ${photosCardHtml(t)}
    ${as.some(a => a.comment) ? `<section class="card"><h2>Trial Comments</h2><p class="small muted" style="margin-bottom:6px">By assessment date. These go at the end of the PDF and into Trial Info in the Excel export.</p>${commentCards(t, as)}</section>` : ''}
    <section class="card">
      <h2>Field Layout</h2>
      <p class="small muted">Plot number and treatment for each plot.${t.untreated ? ' <span class="pill" style="background:var(--utc-bg);color:var(--ink)">Untreated = Darker</span>' : ''}</p>
      ${layoutSets(t).slice().reverse().map(st => `${st.name ? `<div class="setname">${esc(st.name)}</div>` : ''}<div class="scroll"><table class="map"><tbody>
        ${st.rows.map(row => `<tr>${row.label ? `<th class="l">${row.label}</th>` : ''}${row.cells.map(c => c.trt ? `<td><span class="pc ${c.trt === t.untreated ? 'utc' : ''} ${isCustom(t) ? repClass(c.rep) : ''}"><b>${c.plot}</b><span>T${c.trt}${isCustom(t) ? '' : (c.trt === t.untreated ? ' · UTC' : '')}</span></span></td>` : `<td><span class="pc buf"><b>${c.plot}</b><span>Buffer</span></span></td>`).join('')}</tr>`).reverse().join('')}
      </tbody></table></div>${isCustom(t) ? `<div class="replegend">${[...new Set(st.rows.flatMap(r => r.cells.filter(c => c.trt).map(c => c.rep)))].sort((x, y) => x - y).map(rp => `<span class="rl ${repClass(rp)}">Rep ${rp}</span>`).join('')}</div>` : ''}`).join('')}
      ${(t.trtNames.some(Boolean) || appLetters(t).length) ? `<p class="small" style="margin-top:12px">${range(t.trts).map(k => `<b>T${k}</b> ${esc(trtName(t, k) || '—')}${k === t.untreated ? ' (UTC)' : ''}${appLetters(t).length && k !== t.untreated ? ` <span class="muted">[${esc(trtApps(t, k).join(', ') || 'No Application')}]</span>` : ''}`).join(' · ')}</p>` : ''}
    </section>
    <section class="card" id="geo-card">${geoCardHtml(t)}</section>
    <div class="card subtle" style="padding:12px;margin:16px 0 0">
      ${db.sections.length ? `<label class="field" style="margin:0;max-width:340px"><span>Home Page Section</span><select id="sec-sel">${secOpts(t.section)}</select></label>
        <p class="small muted" style="margin:.4rem 0 0">Only decides where this trial is listed on the home page. It doesn't change the trial or its data.</p>`
      : `<p class="small muted" style="margin:0"><b>Home Page Section:</b> none yet. Sections are created on the home page and only group the trial list there.</p>`}
    </div>
    <button id="del" class="dangerzone" type="button">Delete Trial</button>
  </main>`;
  document.getElementById('xl').onclick = () => openExport(t, null);
  document.getElementById('share').onclick = () => shareTrial(t);
  document.getElementById('copy-trial').onclick = () => copyTrial(t);
  const x1 = document.getElementById('dr-trial-x'); if (x1) x1.onclick = () => { if (confirm('Discard your unsaved changes to this trial?')) { dropDraft('trial:' + t.id); viewTrial(t); } };
  const x2 = document.getElementById('dr-assess-x'); if (x2) x2.onclick = () => { if (confirm('Discard this unfinished assessment date?')) { dropDraft(`assess:${t.id}:new`); viewTrial(t); } };
  app.querySelectorAll('input.import-assess').forEach(inp => inp.onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try { const d = JSON.parse(await f.text()); if (importAssessment(d, t)) viewTrial(t); } catch (err) { alert('That file is not a shared FART assessment.'); }
  });
  app.querySelectorAll('[data-cmt]').forEach(b => b.onclick = () => openComment(t, t.assessments.find(x => x.id === b.dataset.cmt), () => viewTrial(t)));
  wireGeoCard(t, () => viewTrial(t));
  wirePhotosCard(t);
  app.querySelectorAll('[data-sh]').forEach(b => b.onclick = () => shareAssessment(t, t.assessments.find(x => x.id === b.dataset.sh)));
  app.querySelectorAll('[data-lock],[data-unlock]').forEach(b => b.onclick = () => toggleLock(t, t.assessments.find(x => x.id === (b.dataset.lock || b.dataset.unlock)), () => viewTrial(t)));
  app.querySelectorAll('[data-xp]').forEach(b => b.onclick = () => openExport(t, t.assessments.find(x => x.id === b.dataset.xp)));
  const secSel = document.getElementById('sec-sel');
  if (secSel) secSel.onchange = () => { if (secSel.value) t.section = secSel.value; else delete t.section; save(); toast('Home page section updated'); };
  document.getElementById('arch').onclick = () => {
    if (t.archived) { delete t.archived; t.updated = Date.now(); save(); toast('Trial unarchived'); viewTrial(t); return; }
    const open = t.assessments.filter(a => !a.types.length || countDone(t, a) < nPlots(t, a)).length;
    if (!confirm(`Archive ${t.trialId}?${open ? `\n\n${open} assessment date${open > 1 ? 's are' : ' is'} not finished yet.` : ''}\n\nIt moves to "Archived Trials" on the home screen. Nothing is deleted and you can unarchive it any time.`)) return;
    t.archived = Date.now(); save(); toast('Trial archived'); go('#/');
  };
  document.getElementById('del').onclick = () => {
    if (!confirm(`Delete trial "${t.trialId}" and all of its assessment data and photos? This cannot be undone.`)) return;
    photoDelBy('tid', t.id); dropTrialDrafts(t.id); db.trials = db.trials.filter(x => x.id !== t.id); save(); go('#/');
  };
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const a = t.assessments.find(x => x.id === b.dataset.del);
    if (!confirm(`Delete the ${dmy(a.date)} assessment and its data?`)) return;
    if (!t.assessments.some(x => x.id !== a.id && x.date === a.date)) photosOfDay(t, a.date).then(rs => { // photos of that date: delete them too, or keep them as photos only
      if (rs.length && confirm(`Also delete the ${rs.length} photo${rs.length === 1 ? '' : 's'} of ${dmy(a.date)} from this phone?\n\nCancel keeps them – they stay under ${dmy(a.date)} in Photos.`)) photoDel(rs.map(r => r.id)).then(() => wirePhotosCard(t));
    }).catch(() => {});
    dropDraft(`assess:${t.id}:${a.id}`); t.assessments = t.assessments.filter(x => x.id !== a.id); t.updated = Date.now(); save(); viewTrial(t);
  });
}

/* ---------- ASSESSMENT SETUP (step 1: date & crop stage, step 2: describe + add assessments) ---------- */
const STAGE_FIELDS = ['stage', 'stageMin', 'stageMax', 'sizeH', 'sizeW', 'sizeUnit', 'stageOther'];
function pestCodeBox(ty, i) { // fungicide pests: pick Mixed / LESVIS / PYCVIS / PUSVIS, or type another
  const other = ty.stageOther || (ty.stage && !PEST_CODES.includes(ty.stage));
  return `<div class="stagebox"><b class="small">Pest Stage</b>
    <label class="field" style="margin-top:6px"><span>Stage *</span><select data-pp="${i}"><option value="">— Select —</option>${PEST_CODES.map(c => `<option ${!other && ty.stage === c ? 'selected' : ''}>${c}</option>`).join('')}<option value="__other" ${other ? 'selected' : ''}>Other (type it in)…</option></select></label>
    ${other ? `<label class="field"><span>Type the Stage</span><input data-i="${i}" data-f="stage" value="${esc(ty.stage || '')}" autocomplete="off" autocapitalize="characters"></label>` : ''}</div>`;
}
function viewAssessForm(t, a, startStep) {
  const editing = !!a;
  const key = `assess:${t.id}:${editing ? a.id : 'new'}`, draft = getDraft(key); // saved at every step; reopening carries on where you were
  const d = editing ? JSON.parse(JSON.stringify(a)) : {
    id: uid(), date: today(), assessor: db.settings.assessor || '', cropBBCH: '', cropBBCHMin: '', cropBBCHMax: '', notes: '', types: [], data: {}, created: Date.now(), apps: null
  };
  if (draft) { Object.assign(d, JSON.parse(JSON.stringify(draft.data.d))); d.data = editing ? JSON.parse(JSON.stringify(a.data)) : {}; }
  if (!Array.isArray(d.apps)) d.apps = null;
  // a new date starts blank – earlier dates in this trial can be looked at (and copied from) under "Previous assessments"
  const prevAs = t.assessments.filter(x => x.id !== d.id && x.types.length).sort((x, y) => (y.date || '').localeCompare(x.date || '') || y.created - x.created);
  const back = `#/trial/${t.id}`;
  let step = startStep || (draft && draft.step) || 1;

  app.innerHTML = `
  <header class="top"><a class="back" href="${back}">← ${esc(t.trialId)}</a><h1>${editing ? 'Edit Assessment Date' : 'New Assessment Date'}</h1><a class="brand sm" href="#/" aria-label="FART – back to the home page"><b>FART</b><span>Field Assessment Recording Tool</span></a></header>
  <main>
    <div class="steps">
      <button class="step" data-st="1" type="button"><b>1</b> Date &amp; Crop Stage</button>
      <button class="step" data-st="2" type="button"><b>2</b> Assessments</button>
    </div>

    <div data-step="1">
      <section class="card">
        <h2>Date</h2>
        <div class="grid2">
          <label class="field"><span>Date * <span class="muted" style="font-weight:400">(DD/MM/YYYY)</span></span><span class="datewrap"><input id="a-date" inputmode="numeric" maxlength="10" placeholder="DD/MM/YYYY" value="${esc(draft && draft.data.dateTxt != null ? draft.data.dateTxt : dmy(d.date))}" autocomplete="off" readonly><button type="button" id="a-cal" class="calbtn" aria-label="Open calendar"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button></span></label>
          <label class="field"><span>Assessor</span><input id="a-who" value="${esc(d.assessor)}" placeholder="Initials or name" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase"></label>
        </div>
        <h3>Crop Growth Stage (BBCH)</h3>
        ${multiSet(t) ? `<p class="small muted" style="margin:-4px 0 6px">This trial has ${t.sets.length} crops / varieties. Choose which ones you are assessing on this date, then enter the stage of each.</p>
        <h3 class="h3s" style="margin:6px 0 4px">Crops to Assess</h3>
        <div class="chips" id="cs-chips">${t.sets.map((_, i) => `<button type="button" class="chip" data-cs="${i}">${esc(cropSetName(t, i))}</button>`).join('')}</div>
        <p class="small muted" id="cs-info" style="margin:.4rem 0 .6rem"></p>` : ''}
        <div data-setblk="0">${multiSet(t) ? `<h3 class="h3s" style="margin:6px 0 4px">${esc(cropSetName(t, 0))}</h3>` : ''}
        <div class="grid3">
          <label class="field"><span>Majority *</span><input id="a-bbch" inputmode="numeric" value="${esc(d.cropBBCH || '')}" placeholder="e.g. 32" autocomplete="off"></label>
          <label class="field"><span>Minimum</span><input id="a-bbch-min" inputmode="numeric" value="${esc(d.cropBBCHMin || '')}" autocomplete="off"></label>
          <label class="field"><span>Maximum</span><input id="a-bbch-max" inputmode="numeric" value="${esc(d.cropBBCHMax || '')}" autocomplete="off"></label>
        </div></div>
        ${multiSet(t) ? t.sets.slice(1).map((_, j) => { const i = j + 1, st = stageOf(d, i); return `<div data-setblk="${i}"><h3 class="h3s" style="margin:6px 0 4px">${esc(cropSetName(t, i))}</h3>
        <div class="grid3">
          <label class="field"><span>Majority *</span><input data-sb="${i}" data-sf="b" inputmode="numeric" value="${esc(st.b || '')}" placeholder="e.g. 32" autocomplete="off"></label>
          <label class="field"><span>Minimum</span><input data-sb="${i}" data-sf="min" inputmode="numeric" value="${esc(st.min || '')}" autocomplete="off"></label>
          <label class="field"><span>Maximum</span><input data-sb="${i}" data-sf="max" inputmode="numeric" value="${esc(st.max || '')}" autocomplete="off"></label>
        </div></div>`; }).join('') : ''}
        <label class="field"><span>Notes</span><input id="a-notes" value="${esc(d.notes)}" placeholder="Weather, conditions…"></label>
        <div id="ap-block" ${appLetters(t).length ? '' : 'hidden'}>
          <h3 class="h3s">Plots to Assess</h3>
          <div class="seg mini"><button type="button" id="ap-all">All Applications</button><button type="button" id="ap-sel">Choose Applications</button></div>
          <div id="ap-chips" class="appchips" hidden></div>
          <p class="small muted" id="ap-info" style="margin:.4rem 0 0"></p>
        </div>
      </section>
    </div>

    <div data-step="2" hidden>
      <section class="card">
        <h2>Describe an Assessment</h2>
        <p class="small muted">Choose what you are assessing, then tap <b>+ Add Assessment</b>. It is added to this date's list below.</p>
        <label class="field"><span>Assessment Menu</span><select id="a-menu"></select></label>
        <div id="sel-hint" class="small muted" style="margin-bottom:6px">Tap to select (you can select several):</div>
        <div id="menu-items" class="chips" style="margin-bottom:14px"></div>
        <div id="bld"></div>
        <div id="custom-box" hidden>
          <p class="small muted">Build an assessment of your own, with your own name, unit and range.</p>
          <label class="field"><span>Name *</span><input id="c-name" placeholder="e.g. Tiller number" autocomplete="off"></label>
          <label class="field"><span>Assessment Type <span class="muted" style="font-weight:400">(type anything)</span></span><input id="c-type" list="atype-list" placeholder="e.g. Count, Score, Cover, Height" autocomplete="off">
            <datalist id="atype-list"><option>Count</option><option>Score</option><option>Cover</option><option>Height</option><option>Damage</option><option>Efficacy</option><option>Yield</option><option>Quality</option></datalist></label>
          <div class="grid3">
            <label class="field"><span>Unit</span><input id="c-unit" placeholder="%, cm, 0–9" autocomplete="off"></label>
            <label class="field"><span>Min</span><input id="c-min" inputmode="decimal" autocomplete="off"></label>
            <label class="field"><span>Max</span><input id="c-max" inputmode="decimal" autocomplete="off"></label>
          </div>
          <div class="grid2">
            <label class="field"><span>Subsamples per Plot</span><input id="c-subs" inputmode="numeric" value="1" autocomplete="off"></label>
            <label class="chk" style="min-height:44px;align-self:center"><input type="checkbox" id="c-untr"> Untreated Plots Only</label>
          </div>
          <button id="add-custom" class="primary" type="button" style="width:100%">+ Add Custom Assessment</button>
        </div>
        <div id="std-add">
          <div class="grid2">
            <label class="field"><span>Subsamples per Plot</span><input id="b-subs" inputmode="numeric" value="1" autocomplete="off"></label>
            <label class="chk" style="min-height:44px;align-self:center"><input type="checkbox" id="b-untr"> Untreated Plots Only</label>
          </div>
          <button id="add-assess" class="primary" type="button" style="width:100%">+ Add Assessment</button>
        </div>
      </section>

      <section class="card">
        <h2>Added Assessments</h2>
        <div id="sum" class="sumline"></div>
        <div id="types"></div>
        ${prevAs.length ? `<details style="margin-top:6px"><summary>Previous Assessments in This Trial (${prevAs.length} Date${prevAs.length === 1 ? '' : 's'})</summary>
          <p class="small muted" style="margin:6px 0 0">Tap one to add it to this date, or add everything from a date.</p>
          ${prevAs.map((pa, pi) => `<div style="margin-top:10px"><div class="arow"><b>${esc(dmy(pa.date))}</b><button class="small" data-pall="${pi}" type="button">Add All</button></div>
            <div class="chips" style="margin-top:6px">${pa.types.map((ty, ti) => `<button class="chip" data-pt="${pi}.${ti}" type="button">${esc(typeLabel(ty))}</button>`).join('')}</div></div>`).join('')}</details>` : ''}
      </section>
    </div>

    <div class="actions">
      <button id="w-back" type="button">← Back</button>
      <button id="w-next" class="primary" type="button">Next: Add Assessments →</button>
      <button id="a-start" class="primary" type="button">Save &amp; Start Assessing →</button>
      <button id="a-save" type="button">${editing ? 'Save Changes' : 'Save for Later'}</button>
      <button id="w-cancel" type="button">${editing ? 'Discard Changes' : 'Discard'}</button>
    </div>
  </main>`;

  const $ = id => document.getElementById(id);
  /* which plots this date covers: all applications, or only some */
  function drawScope() {
    const L = appLetters(t), sel = !!d.apps;
    $('ap-all').classList.toggle('on', !sel); $('ap-sel').classList.toggle('on', sel);
    $('ap-chips').hidden = !sel;
    $('ap-chips').innerHTML = L.map(l => `<button type="button" class="chip ${sel && d.apps.includes(l) ? 'on' : ''}" data-ap="${l}">${l}</button>`).join('');
    $('ap-chips').querySelectorAll('[data-ap]').forEach(b => b.onclick = () => { const l = b.dataset.ap; d.apps = d.apps.includes(l) ? d.apps.filter(x => x !== l) : [...d.apps, l].sort(); drawScope(); });
    const nPlotsUtc = () => plots(t).filter(p => isUtc(t, p.trt)).length, n = nPlots(t, d), tot = plots(t).length;
    $('ap-info').textContent = sel ? `${n} of ${tot} plots will be assessed on this date${t.untreated ? ' (untreated always included)' : ''}.${n > nPlotsUtc() ? '' : ' Tick at least one application.'}` : `All ${tot} plots will be assessed on this date.`;
  }
  function drawCrops() { // which crops / varieties are assessed on this date (null = all of them)
    if (!multiSet(t)) return;
    if (!Array.isArray(d.cropSets) || !d.cropSets.length) d.cropSets = null;
    app.querySelectorAll('[data-cs]').forEach(b => b.classList.toggle('on', setOn(d, +b.dataset.cs)));
    app.querySelectorAll('[data-setblk]').forEach(el => { el.hidden = !setOn(d, +el.dataset.setblk); });
    const n = setsFor(t, d).length;
    $('cs-info').textContent = n === t.sets.length ? `All ${n} crops / varieties – ${nPlots(t, d)} plots.` : `${n} of ${t.sets.length} crops / varieties: ${setsFor(t, d).map(i => cropSetName(t, i)).join(', ')} – ${nPlots(t, d)} plots.`;
    drawScope();
  }
  app.querySelectorAll('[data-cs]').forEach(b => b.onclick = () => {
    const i = +b.dataset.cs, cur = setsFor(t, d);
    if (cur.includes(i)) {
      if (cur.length === 1) { toast('Assess at least one crop / variety'); return; }
      if (editing && scopedPlots(t, d).some(p => (p.set || 0) === i && plotStarted(d, p.plot)) && !confirm(`${cropSetName(t, i)} already has values on this date. Leave it out anyway? The values are kept, but hidden and not exported while it is left out.`)) return;
      d.cropSets = cur.filter(x => x !== i);
    } else d.cropSets = [...cur, i].sort((x, y) => x - y);
    if (d.cropSets.length === t.sets.length) d.cropSets = null;
    drawCrops(); watch();
  });
  $('ap-all').onclick = () => { d.apps = null; drawScope(); };
  $('ap-sel').onclick = () => { if (!d.apps) d.apps = []; drawScope(); };
  const watch = () => { if (!finished) queueDraft(key, snap); };
  const pickDate = () => openCalendar(parseDmy($('a-date').value) || today(), iso => { $('a-date').value = dmy(iso); watch(); }, () => { $('a-date').readOnly = false; $('a-date').focus(); });
  $('a-cal').onclick = pickDate; $('a-date').onclick = () => { if ($('a-date').readOnly) pickDate(); };
  $('a-who').oninput = e => { const el = e.target, pos = el.selectionStart; el.value = el.value.toUpperCase(); try { el.setSelectionRange(pos, pos); } catch (err) {} };
  $('a-date').oninput = e => { // types as DD/MM/YYYY, adding the slashes for you
    const g = e.target.value.replace(/\D/g, '').slice(0, 8); let o = g.slice(0, 2); if (g.length > 2) o += '/' + g.slice(2, 4); if (g.length > 4) o += '/' + g.slice(4); e.target.value = o;
  };
  function showStep(n) {
    step = n;
    app.querySelectorAll('[data-step]').forEach(sec => { sec.hidden = +sec.dataset.step !== n; });
    app.querySelectorAll('.step').forEach(b => b.classList.toggle('on', +b.dataset.st === n));
    $('w-back').hidden = n === 1; $('w-cancel').hidden = n !== 1;
    $('w-next').hidden = n !== 1; $('a-start').hidden = n !== 2; $('a-save').hidden = n === 1 && !editing;
    window.scrollTo(0, 0);
  }
  function goStep(n) {
    if (n === 2) {
      if (!parseDmy($('a-date').value)) { alert('Please enter the date as DD/MM/YYYY.'); $('a-date').focus(); return; }
      if (setOn(d, 0) && !$('a-bbch').value.trim()) { alert(`Please enter the crop growth stage (BBCH)${multiSet(t) ? ' of ' + cropSetName(t, 0) : ''} – the majority value.`); $('a-bbch').focus(); return; }
      const emptyStage = [...app.querySelectorAll('input[data-sb][data-sf="b"]')].find(inp => setOn(d, +inp.dataset.sb) && !inp.value.trim());
      if (emptyStage) { alert(`Please enter the crop growth stage (BBCH) of ${cropSetName(t, +emptyStage.dataset.sb)} – the majority value.`); emptyStage.focus(); return; }
    }
    showStep(n);
  }
  app.querySelectorAll('.step').forEach(b => b.onclick = () => goStep(+b.dataset.st));
  $('w-next').onclick = () => goStep(2);
  $('w-back').onclick = () => goStep(1);

  const forThis = MENU_FOR[t.type] || [];
  let menuKey = forThis[0] || 'common';
  const getMenu = () => MENUS.find(m => m.key === menuKey);
  const menuOpt = k => `<option value="${k}" ${k === menuKey ? 'selected' : ''}>${esc(MENUS.find(m => m.key === k).label)}</option>`;
  const mine = ['common', ...forThis, 'custom'], others = MENUS.map(m => m.key).filter(k => !mine.includes(k));
  $('a-menu').innerHTML = t.type
    ? `<optgroup label="${esc(t.type)} trial">${mine.map(menuOpt).join('')}</optgroup><optgroup label="Other menus">${others.map(menuOpt).join('')}</optgroup>`
    : mine.concat(others).map(menuOpt).join('');

  const subsVal = () => Math.max(1, Math.min(50, parseInt($('b-subs').value, 10) || 1));
  const blankType = () => ({ id: uid(), name: '', unit: '', min: '', max: '', target: '', kind: '', leaf: '', stage: '', stageMin: '', stageMax: '', sizeH: '', sizeW: '', sizeUnit: 'cm', stageMode: '', stageOther: false, atype: '', subs: subsVal(), untreatedOnly: false, noPhyto: false, phyto: false });
  const mkType = (it, extra) => ({ ...blankType(), name: it.n, unit: it.u || '', min: it.min ?? '', max: it.max ?? '', untreatedOnly: !!it.untr || (!!$('b-untr') && $('b-untr').checked), phyto: !!it.phyto, ...extra });
  function addIfNew(nt) {
    if (d.types.some(x => typeLabel(x).toLowerCase() === typeLabel(nt).toLowerCase())) return false;
    if (needsStage(nt)) { const o = d.types.find(x => x.target === nt.target && x.kind === nt.kind); if (o) STAGE_FIELDS.forEach(f => { nt[f] = o[f] || ''; }); }
    d.types.push(nt); return true;
  }
  function removeType(i) {
    const ty = d.types[i];
    const hasData = Object.values(d.data).some(r => (r[ty.id] !== undefined && r[ty.id] !== '') || r['_s_' + ty.id]);
    if (hasData && !confirm(`"${typeLabel(ty)}" has data recorded. Remove it and its data?`)) return false;
    d.types.splice(i, 1); return true;
  }

  /* describe: select assessments (several allowed), weeds/pests and leaf levels, then Add */
  let sel = new Set(), picked = [], leaves = [];
  function drawMenu() {
    const m = getMenu();
    ['menu-items', 'sel-hint', 'bld', 'std-add'].forEach(id => { $(id).hidden = !!m.custom; });
    $('custom-box').hidden = !m.custom;
    $('menu-items').innerHTML = m.items.map((it, i) => `<button class="chip ${sel.has(i) ? 'on' : ''}" data-m="${i}" type="button">${sel.has(i) ? '✓ ' : ''}${esc(it.label || it.n)}</button>`).join('');
    $('menu-items').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const i = +b.dataset.m; if (sel.has(i)) sel.delete(i); else sel.add(i); drawMenu(); });
  }
  function orderedGroups(m) {
    let g = m.groups || [];
    if (m.key === 'fungicide') { const c = (t.crop || '').match(/\(([A-Z]+)\)/); const code = c ? c[1] : ''; const first = code.startsWith('TRZA') ? 'Wheat' : code.startsWith('HORV') ? 'Barley' : code.startsWith('BRSN') ? 'OSR' : ''; g = [...g].sort((x, y) => (y[0] === first) - (x[0] === first)); }
    return g;
  }
  function drawPicked() {
    const kind = getMenu().target;
    $('b-picked').innerHTML = picked.length
      ? picked.map((c, i) => `<button class="chip on" data-p="${i}" title="Remove" type="button">${esc(c)} ✕</button>`).join('')
      : `<span class="small muted">No ${kind === 'weed' ? 'weeds' : 'pests'} chosen yet</span>`;
    $('b-picked').querySelectorAll('[data-p]').forEach(b => b.onclick = () => { picked.splice(+b.dataset.p, 1); drawPicked(); });
  }
  const addPick = v => { v = (v || '').trim(); if (v && !picked.includes(v)) { picked.push(v); drawPicked(); } };
  function drawBuilder() {
    const m = getMenu();
    if (!m.target) { $('bld').innerHTML = ''; return; }
    const kind = m.target, word = kind === 'weed' ? 'weed' : 'pest / disease';
    const hasLeaf = m.items.some(it => it.leaf);
    const groups = orderedGroups(m);
    $('bld').innerHTML = `<div class="stagebox" style="padding-bottom:10px">
      <b>${kind === 'weed' ? 'Weeds' : 'Pests / Diseases'}</b>
      <p class="small muted" style="margin:.2rem 0 .6rem">Needed for the ${kind === 'weed' ? 'weed' : 'pest'} assessments. Choose one or more.</p>
      ${groups.length ? `<label class="field"><span>${kind === 'weed' ? 'Weed' : 'Pest / disease'}</span><select id="b-sel"><option value="">— Select to add —</option>
        ${groups.map(([g, items]) => `<optgroup label="${g}">${items.map(([c, n]) => `<option value="${c}">${c} (${esc(n)})</option>`).join('')}</optgroup>`).join('')}</select></label>` : ''}
      <label class="field"><span>${groups.length ? 'Or type your own' : 'Type a ' + word}</span>
        <span style="display:flex;gap:8px"><input id="b-txt" placeholder="Code or name" autocomplete="off" autocapitalize="characters"><button id="b-add" class="small" type="button">Add</button></span></label>
      <div id="b-picked" class="chips" style="margin-bottom:12px"></div>
      ${hasLeaf ? `<b class="small">Leaf Level(s) or Ear</b><div class="chips" id="b-leaves" style="margin:6px 0 4px">${LEAVES.map(l => `<button class="chip ${leaves.includes(l) ? 'on' : ''}" data-l="${l}" type="button">${l}</button>`).join('')}</div>` : ''}
    </div>`;
    drawPicked();
    if ($('b-sel')) $('b-sel').onchange = () => { addPick($('b-sel').value); $('b-sel').value = ''; };
    $('b-add').onclick = () => { addPick($('b-txt').value); $('b-txt').value = ''; };
    $('b-txt').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('b-add').click(); } };
    $('bld').querySelectorAll('[data-l]').forEach(b => b.onclick = () => {
      const l = b.dataset.l; leaves = leaves.includes(l) ? leaves.filter(x => x !== l) : [...leaves, l].sort((x, y) => LEAVES.indexOf(x) - LEAVES.indexOf(y));
      b.classList.toggle('on', leaves.includes(l));
    });
  }
  $('add-custom').onclick = () => {
    const name = $('c-name').value.trim();
    if (!name) { toast('Give the custom assessment a name'); $('c-name').focus(); return; }
    const sb = Math.max(1, Math.min(50, parseInt($('c-subs').value, 10) || 1));
    const ok = addIfNew({ ...blankType(), name, unit: $('c-unit').value.trim(), min: $('c-min').value.trim(), max: $('c-max').value.trim(), atype: $('c-type').value.trim(), subs: sb, untreatedOnly: $('c-untr').checked });
    if (!ok) { toast('Already added'); return; }
    ['c-name', 'c-type', 'c-unit', 'c-min', 'c-max'].forEach(id => { $(id).value = ''; }); $('c-untr').checked = false; $('c-subs').value = 1;
    drawTypes(); toast('Custom assessment added');
  };
  $('a-menu').onchange = () => { menuKey = $('a-menu').value; sel = new Set(); picked = []; leaves = []; drawMenu(); drawBuilder(); };
  $('b-subs').onchange = () => { $('b-subs').value = subsVal(); };

  $('add-assess').onclick = () => {
    const m = getMenu(), kind = m.target, word = kind === 'weed' ? 'weed' : 'pest';
    if ($('b-txt') && $('b-txt').value.trim()) { addPick($('b-txt').value); $('b-txt').value = ''; }
    const items = [...sel].sort((x, y) => x - y).map(i => m.items[i]);
    if (!items.length) { toast('Choose an assessment first'); return; }
    for (const it of items) {
      if (it.tg && !picked.length) { toast(`Choose a ${word} first`); return; }
      if (it.leaf && !leaves.length) { toast('Choose a leaf level or Ear first'); return; }
    }
    let n = 0;
    items.forEach(it => (it.tg ? picked : ['']).forEach(tg => (it.leaf ? leaves : ['']).forEach(l => { if (addIfNew(mkType(it, { target: tg, kind: tg ? kind : '', needStage: !!tg && !m.noStage, stageMode: (tg && m.stageMode) || '', leaf: l }))) n++; })));
    sel = new Set(); picked = []; leaves = []; $('b-untr').checked = false; // start fresh for the next assessment
    drawMenu(); drawBuilder(); drawTypes();
    toast(n ? `Added ${n} assessment${n > 1 ? 's' : ''}` : 'Already added');
  };

  /* Added Assessments: one separate card each */
  function cardHtml(ty, i) {
    const weed = ty.kind === 'weed', word = weed ? 'Weed' : 'Pest';
    const inp = (f, label, ph) => `<label class="field"><span>${label}</span><input data-i="${i}" data-f="${f}" inputmode="decimal" value="${esc(ty[f] || '')}" placeholder="${ph || ''}" autocomplete="off"></label>`;
    return `<div class="acard">
      <div class="ahead"><span class="anum">${i + 1}</span>
        <div class="atitle"><b>${esc(ty.name || 'New assessment')}</b>${ty.target ? `<span class="pill">${esc(ty.target)}</span>` : ''}${ty.leaf ? `<span class="pill">${esc(ty.leaf)}</span>` : ''}${ty.atype ? `<span class="pill">${esc(ty.atype)}</span>` : ''}${ty.untreatedOnly ? `<span class="pill warn">Untreated Plots Only</span>` : ''}${ty.noPhyto ? `<span class="pill">No Phyto</span>` : ''}</div>
        <button class="small danger" data-rm="${i}" title="Remove" aria-label="Remove" type="button">✕</button></div>
      ${needsStage(ty) && ty.stageMode === 'code' ? pestCodeBox(ty, i) : ''}
      ${needsStage(ty) && ty.stageMode !== 'code' ? `<div class="stagebox"><b class="small">${word} Growth Stage</b>
        <div class="grid3" style="margin-top:6px">${inp('stage', 'Majority *')}${inp('stageMin', 'Minimum')}${inp('stageMax', 'Maximum')}</div>
        ${weed ? `<div class="arow"><b class="small">Weed Size</b><label class="small" style="display:flex;align-items:center;gap:6px">Unit
          <select data-i="${i}" data-f="sizeUnit" style="width:auto;min-height:34px">${['cm', 'mm'].map(u => `<option ${(ty.sizeUnit || 'cm') === u ? 'selected' : ''}>${u}</option>`).join('')}</select></label></div>
          <div class="grid2" style="margin-top:6px">${inp('sizeH', 'Height')}${inp('sizeW', 'Width')}</div>` : ''}</div>` : ''}
      ${isHeight(ty) ? `<label class="field" style="max-width:220px"><span>Height Unit</span><select data-i="${i}" data-f="unit">${[...new Set(['mm', 'cm', ty.unit].filter(Boolean))].map(u => `<option ${ty.unit === u ? 'selected' : ''}>${u}</option>`).join('')}</select></label>` : ''}
      <label class="chk" style="margin-bottom:.9rem"><input type="checkbox" data-i="${i}" data-c="untreatedOnly" ${ty.untreatedOnly ? 'checked' : ''}> Record on Untreated Plots Only</label>
      ${isPhyto(ty) ? `<label class="chk" style="margin-bottom:.9rem"><input type="checkbox" data-i="${i}" data-c="noPhyto" ${ty.noPhyto ? 'checked' : ''}> No Phyto (Fills 0 on Every Plot)</label>` : ''}
      <details ${ty.name ? '' : 'open'}><summary>Name, Unit, Range, Subsamples</summary>
        <div class="type-row" style="margin-top:8px">
          <label class="tname"><span>Name</span><input data-i="${i}" data-f="name" value="${esc(ty.name)}" placeholder="Type an assessment name"></label>
          ${isHeight(ty) ? `<label><span>Unit</span><input disabled value="${esc(ty.unit)} (set above)"></label>` : `<label><span>Unit</span><input data-i="${i}" data-f="unit" value="${esc(ty.unit)}" placeholder="%, cm, 0–9"></label>`}
          <label><span>Min</span><input data-i="${i}" data-f="min" value="${esc(ty.min)}" inputmode="decimal"></label>
          <label><span>Max</span><input data-i="${i}" data-f="max" value="${esc(ty.max)}" inputmode="decimal"></label>
          <label><span>Subsamples</span><input data-i="${i}" data-f="subs" value="${subsOf(ty)}" inputmode="numeric"></label>
        </div>
        <label class="field" style="margin-top:10px"><span>Assessment Type (free type)</span><input data-i="${i}" data-f="atype" list="atype-list" value="${esc(ty.atype || '')}" placeholder="e.g. Count, Score, Cover" autocomplete="off"></label>
      </details>
    </div>`;
  }
  function drawTypes() {
    const n = d.types.length;
    const weeds = new Set(d.types.filter(x => x.kind === 'weed').map(x => x.target)).size, pests = new Set(d.types.filter(x => x.kind === 'pest').map(x => x.target)).size;
    $('sum').textContent = n ? `${n} assessment${n > 1 ? 's' : ''} added${weeds ? ` · ${weeds} weed${weeds > 1 ? 's' : ''}` : ''}${pests ? ` · ${pests} pest${pests > 1 ? 's' : ''}` : ''}` : '';
    $('types').innerHTML = d.types.map(cardHtml).join('') || `<p class="muted">Nothing added yet. Describe an assessment above and tap <b>+ Add Assessment</b>.</p>`;
    $('types').querySelectorAll('input[data-f],select[data-f]').forEach(inp => inp.oninput = () => {
      const i = +inp.dataset.i, f = inp.dataset.f, ty = d.types[i]; ty[f] = inp.value;
      if (STAGE_FIELDS.includes(f) && needsStage(ty)) d.types.forEach((o, j) => { if (j !== i && o.target === ty.target && o.kind === ty.kind) { o[f] = inp.value; const el = $('types').querySelector(`input[data-i="${j}"][data-f="${f}"]`); if (el) el.value = inp.value; } });
    });
    $('types').querySelectorAll('input[data-c]').forEach(cb => cb.onchange = () => { d.types[+cb.dataset.i][cb.dataset.c] = cb.checked; drawTypes(); });
    $('types').querySelectorAll('select[data-pp]').forEach(sel => sel.onchange = () => {
      const i = +sel.dataset.pp, ty = d.types[i], other = sel.value === '__other', stage = other ? '' : sel.value;
      d.types.forEach(o => { if (o.target === ty.target && o.kind === ty.kind) { o.stage = stage; o.stageOther = other; } });
      drawTypes(); if (other) { const el = $('types').querySelector(`input[data-i="${i}"][data-f="stage"]`); if (el) el.focus(); }
    });
    $('types').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if (removeType(+b.dataset.rm)) drawTypes(); });
  }
  const addFrom = s => addIfNew({ ...blankType(), name: s.name, unit: s.unit || '', min: s.min ?? '', max: s.max ?? '', target: s.target || '', kind: s.kind || '', needStage: s.needStage, stageMode: s.stageMode || '', phyto: !!s.phyto, leaf: s.leaf || '', atype: s.atype || '', untreatedOnly: !!s.untreatedOnly, subs: subsOf(s) }); // growth stages are entered again for this date
  app.querySelectorAll('[data-pt]').forEach(b => b.onclick = () => { const [pi, ti] = b.dataset.pt.split('.').map(Number); toast(addFrom(prevAs[pi].types[ti]) ? 'Added' : 'Already added'); drawTypes(); });
  app.querySelectorAll('[data-pall]').forEach(b => b.onclick = () => { let n = 0; prevAs[+b.dataset.pall].types.forEach(ty => { if (addFrom(ty)) n++; }); drawTypes(); toast(n ? `Added ${n} assessment${n > 1 ? 's' : ''}` : 'Already added'); });

  function readSetStages() { // the growth stage of the 2nd, 3rd… crop / variety
    const ins = [...app.querySelectorAll('input[data-sb]')]; if (!ins.length) return;
    const o = {}; ins.forEach(inp => { const i = inp.dataset.sb; (o[i] = o[i] || {})[inp.dataset.sf] = inp.value.trim(); });
    d.setBBCH = o;
  }
  function commit(startAfter) {
    d.date = parseDmy($('a-date').value); d.assessor = $('a-who').value.trim().toUpperCase(); d.notes = $('a-notes').value.trim();
    d.cropBBCH = $('a-bbch').value.trim(); d.cropBBCHMin = $('a-bbch-min').value.trim(); d.cropBBCHMax = $('a-bbch-max').value.trim(); readSetStages();
    if (!d.date) { showStep(1); alert('Please enter the date as DD/MM/YYYY.'); $('a-date').focus(); return; }
    if (setOn(d, 0) && !d.cropBBCH) { showStep(1); alert(`Please enter the crop growth stage (BBCH)${multiSet(t) ? ' of ' + cropSetName(t, 0) : ''} – the majority value.`); $('a-bbch').focus(); return; }
    if (multiSet(t)) { const miss = t.sets.findIndex((_, i) => i && setOn(d, i) && !stageOf(d, i).b); if (miss > 0) { showStep(1); alert(`Please enter the crop growth stage (BBCH) of ${cropSetName(t, miss)} – the majority value.`); app.querySelector(`[data-sb="${miss}"][data-sf="b"]`).focus(); return; } }
    const tr = v => String(v ?? '').trim();
    d.types = d.types.map(ty => ({ ...ty, name: tr(ty.name), unit: tr(ty.unit), min: tr(ty.min), max: tr(ty.max), stage: tr(ty.stage), stageMin: tr(ty.stageMin), stageMax: tr(ty.stageMax), sizeH: tr(ty.sizeH), sizeW: tr(ty.sizeW), subs: subsOf(ty), atype: tr(ty.atype) })).filter(ty => ty.name);
    if (startAfter && !d.types.length) { showStep(2); alert('Add at least one assessment first.'); return; }
    const noStage = d.types.filter(ty => needsStage(ty) && !ty.stage);
    if (noStage.length) {
      showStep(2); drawTypes();
      alert('Please choose or enter the growth stage for: ' + [...new Set(noStage.map(ty => ty.target))].join(', '));
      const el = $('types').querySelector(`input[data-i="${d.types.indexOf(noStage[0])}"][data-f="stage"]`) || $('types').querySelector(`select[data-pp="${d.types.indexOf(noStage[0])}"]`); if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); }
      return;
    }
    if (d.apps && !d.apps.length) { showStep(1); alert('No plots are covered by the applications chosen. Tick at least one application, or choose All Applications.'); return; }
    const names = d.types.map(ty => typeLabel(ty).toLowerCase());
    if (new Set(names).size !== names.length) { showStep(2); alert('Two assessments have the same name and unit. Please make them distinct.'); return; }
    if (t.type === 'Herbicide' && t.untreated && d.types.length && !d.types.some(ty => ty.kind === 'weed' && /count/i.test(ty.name)) // any weed count (general or untreated) means no reminder
      && !confirm('Are you sure you do not require a Untreated Weed Count for this assessment date?')) { showStep(2); return; }
    // drop data for removed assessments
    const ids = new Set(d.types.map(ty => ty.id));
    Object.values(d.data).forEach(r => Object.keys(r).forEach(k => { const base = k.startsWith('_s_') ? k.slice(3) : k; if (k !== '_note' && k !== '_na' && !ids.has(base)) delete r[k]; }));
    db.settings.assessor = d.assessor;
    if (!d.device) stampAssessment(d); // remembers which device (and so whose signature) made this date
    const i = t.assessments.findIndex(x => x.id === d.id);
    if (i >= 0) t.assessments[i] = d; else t.assessments.push(d);
    finished = true; dropDraft(key);
    t.updated = Date.now(); save();
    if (startAfter) go(`#/trial/${t.id}/a/${d.id}/plot/${firstIncomplete(t, d)}`);
    else { toast('Saved'); go(`#/trial/${t.id}`); }
  }
  $('a-start').onclick = () => commit(true);
  $('a-save').onclick = () => commit(false);
  /* drafts: the form is saved at every input or tap, with the step you were on */
  let finished = false;
  const collectFields = () => {
    d.assessor = $('a-who').value.trim().toUpperCase(); d.notes = $('a-notes').value.trim();
    d.cropBBCH = $('a-bbch').value.trim(); d.cropBBCHMin = $('a-bbch-min').value.trim(); d.cropBBCHMax = $('a-bbch-max').value.trim(); readSetStages();
    d.date = parseDmy($('a-date').value) || d.date;
  };
  const snap = () => {
    if (finished || !$('a-date')) return null; // the form is already gone
    collectFields(); if (!editing && !d.cropBBCH && !Object.values(d.setBBCH || {}).some(x => x.b) && !d.types.length && !d.notes && !d.apps) return null; // nothing worth keeping yet
    const { data, ...rest } = d;
    return { data: { d: JSON.parse(JSON.stringify(rest)), dateTxt: $('a-date').value }, step };
  };
  app.querySelector('main').addEventListener('input', watch); app.querySelector('main').addEventListener('change', watch);
  app.querySelector('main').addEventListener('click', e => { if (!(e.target.closest && e.target.closest('#w-cancel'))) watch(); });
  $('w-cancel').onclick = () => {
    const dirty = !!getDraft(key) || (draftPending && draftPending.key === key);
    if (dirty && !confirm(editing ? 'Discard your changes to this assessment date?' : 'Discard this unfinished assessment date? Everything you entered will be lost.')) return;
    finished = true; dropDraft(key); go(back);
  };
  drawMenu(); drawBuilder(); drawTypes(); drawScope(); drawCrops(); showStep(step);
}

/* ---------- DATA ENTRY (one plot per page) ---------- */
function viewEntry(t, a, idx, focusAt, keepScroll) {
  const order = walkOrder(t, a);
  if (!order.length) { toast('No plots are covered by the applications chosen for this date'); return goReplace(`#/trial/${t.id}`); }
  idx = clamp(idx, 0, order.length - 1);
  const p = order[idx];
  const last = order.length - 1;
  const done = countDone(t, a);
  const show = !!db.settings.showTrt;
  const rec = a.data[p.plot] || {};
  const base = `#/trial/${t.id}/a/${a.id}`;
  const hintOf = ty => (ty.min !== '' || ty.max !== '') ? `${ty.min !== '' ? ty.min : '…'} to ${ty.max !== '' ? ty.max : '…'}` : ''; // range only; the unit is shown beside the box

  const na = isNA(a, p.plot), locked = !!a.locked;
  const fieldHtml = (ty, i) => {
    if (ty.untreatedOnly) return ''; // untreated counts are entered at the end in Review, so the untreated plots aren't revealed
    if (ty.noPhyto) return `<div class="nophyto">${esc(typeTitle(ty))}: No phyto (0 on every plot)</div>`;
    const hint = hintOf(ty), n = subsOf(ty);
    if (locked) { const v = n > 1 ? ((rec['_s_' + ty.id] || []).filter(x => x !== '').join(' / ')) : val(a, p.plot, ty.id); return `<div class="field entry-field"><span style="display:block;font-weight:600;margin-bottom:.3rem">${esc(typeTitle(ty))}</span><div class="rovalue">${esc(v || '–')}${v && ty.unit ? ' ' + esc(ty.unit) : ''}</div></div>`; }
    if (na) return '';
    if (n > 1) {
      const arr = rec['_s_' + ty.id] || [];
      return `<div class="field entry-field"><span style="display:block;font-weight:600;margin-bottom:.3rem">${esc(typeTitle(ty))}${ty.unit ? ` <b style="color:var(--accent)">${esc(ty.unit)}</b>` : ''} <span class="hint">(${esc(hint ? hint + ' · ' : '')}${n} subsamples)</span></span>
        <div class="subgrid">${range(n).map(k => `<input class="ev" data-t="${ty.id}" data-i="${i}" data-k="${k - 1}" value="${esc(arr[k - 1] ?? '')}" inputmode="decimal" enterkeyhint="next" autocomplete="off" aria-label="Subsample ${k}" placeholder="${k}">`).join('')}</div>
        <div class="small muted" style="margin-top:4px;text-align:center">Mean: <b id="mean-${i}">${esc(rec[ty.id] ?? '–')}</b></div></div>`;
    }
    return `<label class="field entry-field"><span>${esc(typeTitle(ty))} ${hint ? `<span class="hint">(${esc(hint)})</span>` : ''}</span>
      <div class="inwrap"><input class="ev" data-t="${ty.id}" data-i="${i}" value="${esc(rec[ty.id] ?? '')}" inputmode="decimal" enterkeyhint="next" autocomplete="off">${ty.unit ? `<span class="sfx">${esc(ty.unit)}</span>` : ''}</div></label>`;
  };

  const inner = `
  <header class="top"><a class="back" href="#/trial/${t.id}">← ${esc(t.trialId)}</a><span class="spacer"></span>
    <button class="ibtn" id="cmt" type="button" title="Trial comment" aria-label="Trial comment for this date">${ICON.comment}${a.comment ? '<i class="dotmark"></i>' : ''}</button>
    <a class="btn small" href="${base}/review">Review</a><a class="brand sm" href="#/" aria-label="FART – back to the home page"><b>FART</b><span>Field Assessment Recording Tool</span></a></header>
  <div class="plotbar" id="plotbar">
    <div class="pb-row">
      <span class="plot-no">Plot ${pn(p.plot)}</span>${multiSet(t) ? `<span class="pill">${esc(setName(t, p.set))}</span>` : ''}
      <span class="plot-meta">Rep <b>${p.rep}</b>${show ? ` · <b>${esc(trtLabel(t, p.trt))}</b>` : ''}</span>
      <span id="badge" class="done-badge"></span>
    </div>
    <div class="pb-sub"><b>${esc(dmy(a.date))}</b> · ${done} of ${order.length} complete · Plot ${idx + 1} of ${order.length}</div>
    <div class="bar"><div style="width:${done / order.length * 100}%"></div></div>
  </div>
  <main class="entry">
    <form id="ef" onsubmit="return false" autocomplete="off">
    ${kb.sentinel('prev')}
    <section class="card">
      ${locked ? '<div class="nophyto">🔒 This date is locked. Unlock it from the trial page or Review to edit.</div>' : ''}${na && !locked ? '<div class="nophyto">Plot not assessed – recorded as NA</div>' : ''}
      ${a.types.map(fieldHtml).join('')}
      ${kb.sentinel('next')}
      <label class="field" style="margin-bottom:0"><span>Plot Note <span class="hint muted" style="font-weight:400">(optional – tap to add)</span></span>
        <input id="note" tabindex="-1" ${locked ? 'disabled' : ''} value="${esc(rec._note || '')}" enterkeyhint="done" autocomplete="off"></label>
    </section>
    </form>

    <div class="actions" style="justify-content:space-between;align-items:center">
      <label class="small" style="display:flex;gap:.5rem;align-items:center">Go To
        <select id="jump" style="width:auto;min-height:36px">${order.map((q, j) =>
          `<option value="${j}" ${j === idx ? 'selected' : ''}>${plotTag(t, q.plot)} · Rep ${q.rep}${plotComplete(t, a, q.plot) ? ' ✓' : plotStarted(a, q.plot) ? ' …' : ''}</option>`).join('')}</select></label>
      <span style="display:flex;gap:14px;flex-wrap:wrap">
        ${locked ? '' : `<label class="chk small"><input type="checkbox" id="na" ${na ? 'checked' : ''}> Plot Not Assessed</label>`}
        <label class="chk small"><input type="checkbox" id="sun" ${db.settings.contrast ? 'checked' : ''}> ☀ High Contrast</label>
        <label class="chk small"><input type="checkbox" id="serp" ${(a.serpentine !== undefined ? a.serpentine : t.serpentine) ? 'checked' : ''}> Serpentine</label>
        <label class="chk small"><input type="checkbox" id="showTrt" ${show ? 'checked' : ''}> Show Treatment</label>
      </span>
    </div>

  </main>
  <div class="navbtns">
    <button id="prev" ${idx === 0 ? 'disabled' : ''}>← Back</button>
    <button id="next" class="primary">Next →</button>
  </div>`;
  // moving from plot to plot swaps the contents of the same screen, so the keyboard and scroll position stay put
  const shellOld = keepScroll && document.getElementById('shell');
  if (shellOld) { const m0 = shellOld.querySelector('main.entry'), st0 = m0 ? m0.scrollTop : 0; shellOld.innerHTML = inner; const m1 = shellOld.querySelector('main.entry'); if (m1) m1.scrollTop = st0; }
  else app.innerHTML = `<div class="shell" id="shell">${inner}</div>`;

  const inputs = [...app.querySelectorAll('input.ev')];
  const note = document.getElementById('note');
  function check() {
    inputs.forEach(inp => {
      const ty = a.types[inp.dataset.i]; const s = outOfRange(ty, inp.value.trim());
      inp.classList.toggle('bad', s === 'bad'); inp.classList.toggle('warn', s === 'warn');
    });
    document.getElementById('badge').innerHTML = plotComplete(t, a, p.plot) ? `<span class="pill ok">✓ complete</span>` : '';
  }
  const rowFor = () => a.data[p.plot] || (a.data[p.plot] = {});
  const tidy = () => { if (a.data[p.plot] && !Object.keys(a.data[p.plot]).length) delete a.data[p.plot]; t.updated = Date.now(); save(); check(); };
  function store(key, v) {
    v = v.trim(); const r = rowFor();
    if (v === '') delete r[key]; else r[key] = v;
    tidy();
  }
  function storeSub(inp) {
    const ty = a.types[inp.dataset.i];
    const m = setSubValue(a, p.plot, ty, +inp.dataset.k, inp.value);
    const el = document.getElementById('mean-' + inp.dataset.i); if (el) el.textContent = m ?? '–';
    tidy();
  }
  const fields = inputs; // the notes box is outside the Next / arrow sequence
  const kbOpen = () => fields.includes(document.activeElement) || document.activeElement === note;
  // Draw the next plot in place (no hash change event) and refocus, so the keyboard stays open.
  function goPlot(to, at) {
    history.replaceState(null, '', `${base}/plot/${to}`);
    viewEntry(t, a, to, at, true);
  }
  function warnRange() { if (inputs.some(inp => outOfRange(a.types[inp.dataset.i], inp.value.trim()) === 'bad')) toast('A value is outside its expected range'); }
  function nextPlot(at) {
    warnRange();
    if (idx === last) go(`${base}/review`); else goPlot(idx + 1, at);
  }
  function prevPlot(at) { if (idx > 0) goPlot(idx - 1, at); }
  function step(dir) {
    if (document.activeElement === note) { if (dir === 'down' || dir === 'right') nextPlot(0); else if (fields.length) fields[fields.length - 1].focus(); return; }
    if (!fields.length) { if (dir === 'down' || dir === 'right') nextPlot(undefined); else prevPlot(undefined); return; }
    const f = Math.max(fields.indexOf(document.activeElement), 0);
    if (dir === 'down') { if (f < fields.length - 1) fields[f + 1].focus(); else nextPlot(0); }
    else if (dir === 'up') { if (f > 0) fields[f - 1].focus(); else prevPlot(fields.length - 1); }
    else if (dir === 'right') nextPlot(f);
    else if (dir === 'left') prevPlot(f);
  }
  inputs.forEach(inp => {
    inp.oninput = () => inp.dataset.k !== undefined ? storeSub(inp) : store(inp.dataset.t, inp.value);
    inp.onfocus = () => setTimeout(() => inp.select(), 0);
    inp.onkeydown = e => { if (kb.key(e)) return; if (e.key === 'Enter') { e.preventDefault(); step('down'); } };
  });
  note.oninput = () => store('_note', note.value);
  note.onkeydown = e => { if (kb.key(e)) return; if (e.key === 'Enter') { e.preventDefault(); note.blur(); } };
  kb.use({ dirs: ['left', 'right', 'up', 'down'], go: step }, [...fields, note]);
  // The phone's own Previous / Next arrows run through hidden boxes before and after, so they carry on across plots
  app.querySelector('[data-sent="prev"]').onfocus = () => { if (idx > 0) prevPlot(fields.length - 1); else if (fields.length) fields[0].focus(); };
  app.querySelector('[data-sent="next"]').onfocus = () => { if (idx < last) nextPlot(0); else if (fields.length) fields[fields.length - 1].focus(); };
  // Next goes through the assessments on this plot first, then on to the next plot. Back does the reverse.
  const nextBtn = document.getElementById('next');
  const nextText = () => { const f = fields.indexOf(document.activeElement); return (f === fields.length - 1 || document.activeElement === note) ? (idx === last ? 'Finish → Review' : 'Next Plot →') : 'Next →'; };
  const setNext = () => { nextBtn.textContent = nextText(); };
  fields.forEach(f => f.addEventListener('focus', setNext)); note.addEventListener('focus', setNext);
  // bring the box you move to into the middle of the visible area, clear of the keyboard
  [...fields, note].forEach(el => el.addEventListener('focus', () => { ensureVisible(el); setTimeout(() => { if (document.activeElement === el) ensureVisible(el); }, 380); }));
  ['prev', 'next'].forEach(id => document.getElementById(id).addEventListener('mousedown', e => e.preventDefault()));
  nextBtn.onclick = () => { if (fields.includes(document.activeElement) || document.activeElement === note) step('down'); else if (fields.length) fields[0].focus(); else nextPlot(undefined); };
  document.getElementById('prev').onclick = () => { if (fields.includes(document.activeElement)) step('up'); else if (document.activeElement === note) step('up'); else prevPlot(undefined); };
  document.getElementById('jump').onchange = e => goReplace(`${base}/plot/${e.target.value}`);
  document.getElementById('cmt').onclick = () => openComment(t, a, () => { const b = document.getElementById('cmt'); if (b) b.innerHTML = ICON.comment + (a.comment ? '<i class="dotmark"></i>' : ''); });
  const naBox = document.getElementById('na');
  if (naBox) naBox.onchange = e => {
    const r = rowFor();
    if (e.target.checked) {
      if (Object.keys(r).some(k => k !== '_note' && k !== '_na') && !confirm('Clear the values recorded for this plot and mark it as not assessed?')) { e.target.checked = false; return; }
      Object.keys(r).forEach(k => { if (k !== '_note') delete r[k]; }); r._na = true;
    } else delete r._na;
    if (!Object.keys(r).length) delete a.data[p.plot];
    t.updated = Date.now(); save(); viewEntry(t, a, idx);
  };
  document.getElementById('sun').onchange = e => { db.settings.contrast = e.target.checked; applyContrast(); save(); };
  document.getElementById('serp').onchange = e => { // switch walking order part-way through; stay on this plot
    a.serpentine = e.target.checked; t.updated = Date.now(); save();
    goPlot(walkOrder(t, a).findIndex(q => q.plot === p.plot), undefined);
    toast(a.serpentine ? 'Serpentine walk on' : 'Walking in plot order');
  };
  document.getElementById('showTrt').onchange = e => { db.settings.showTrt = e.target.checked; save(); viewEntry(t, a, idx); };
  kb.shell(document.getElementById('shell'));
  check();
  if (focusAt != null && fields.length) { const el = fields[Math.min(focusAt, fields.length - 1)]; el.focus({ preventScroll: true }); ensureVisible(el); }
  else { const firstEmpty = inputs.find(inp => inp.value === '') || null; if (firstEmpty && matchMedia('(pointer:fine)').matches) firstEmpty.focus({ preventScroll: true }); }
}

/* ---------- box plot (SVG) ---------- */
function quantile(sorted, q) { const pos = (sorted.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos); return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo); }
function boxPlotSvg(t, a, ty, sel, si, scale) { // sel = { plot, t } highlights one point; scale = 'fit' (zoom to the data) or 'full' (assessment min to max)
  const st = typeStats(t, a, ty, si);
  const cols = range(t.trts).filter(k => applies(t, ty, k, a)).map(k => { const vals = st.groups[k].vals.filter(v => v.n != null); return { k, vals, v: vals.map(x => x.n).sort((x, y) => x - y) }; });
  const all = cols.flatMap(c => c.v);
  const title = `<h3 style="margin:16px 0 4px">${esc(typeLabel(ty))}${multiSet(t) ? ' – ' + esc(setName(t, si)) : ''}</h3>`;
  if (!all.length) return `<div class="bp">${title}<p class="small muted">No values yet.</p></div>`;
  let lo = Math.min(...all), hi = Math.max(...all);
  if (scale === 'full') { // the whole scale of the assessment, e.g. 0–100 %; no padding

  let g = ty.unit ? `<text x="4" y="9">${esc(ty.unit)}</text>` : '', pts = '', picked = null;
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; g += `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${nice(v)}</text>`; }
  cols.forEach((c, i) => {

    g += `<text x="${cx}" y="${H - 14}" text-anchor="middle">T${c.k}${c.k === t.untreated ? '·UTC' : ''}</text>`;
    if (!c.v.length) return;
    const q1 = quantile(c.v, .25), med = quantile(c.v, .5), q3 = quantile(c.v, .75), mn = c.v[0], mx = c.v[c.v.length - 1];
    g += `<line x1="${cx}" x2="${cx}" y1="${y(mn)}" y2="${y(mx)}" stroke="var(--accent)" stroke-width="1.5"/>
      <line x1="${cx - 7}" x2="${cx + 7}" y1="${y(mn)}" y2="${y(mn)}" stroke="var(--accent)" stroke-width="1.5"/><line x1="${cx - 7}" x2="${cx + 7}" y1="${y(mx)}" y2="${y(mx)}" stroke="var(--accent)" stroke-width="1.5"/>
      <rect x="${cx - bw / 2}" y="${y(q3)}" width="${bw}" height="${Math.max(1, y(q1) - y(q3))}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" rx="2"/>
      <line x1="${cx - bw / 2}" x2="${cx + bw / 2}" y1="${y(med)}" y2="${y(med)}" stroke="var(--accent)" stroke-width="3"/>`;
    c.vals.forEach((v, j) => { // points are spread sideways a little so each can be tapped
      const px = cx + (j - (c.vals.length - 1) / 2) * 6, isSel = !!sel && sel.t === ty.id && String(sel.plot) === String(v.plot);

    });
  });
  const info = picked ? `<b>Plot ${pn(picked.plot)}</b> · Rep ${picked.rep} · Trt ${picked.trt}${trtName(t, picked.trt) ? ' ' + esc(trtName(t, picked.trt)) : ''} · value <b>${esc(picked.raw)}</b> · <a href="#" data-goto>show in table</a>` : 'Tap a point to see which plot it is.';
  return `<div class="bp">${title}<div class="scroll" style="border:0"><svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W, 300)}px;max-width:${W * 1.6}px" role="img" aria-label="Box plot of ${esc(typeLabel(ty))} by treatment">${g}${pts}</svg></div><div class="small bp-info">${info}</div></div>`;
}

/* ---------- plot photos: taken plot by plot and filed under a date (an assessment date, or just the day they are taken); kept on this device only (IndexedDB – not in backups or shared files), exported as a ZIP ---------- */
let photoDbP = null;

const isoDay = ts => new Date(ts - new Date(ts).getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const photoDate = (t, r) => r.date || ((t.assessments.find(a => a.id === r.aid) || {}).date) || isoDay(r.ts); // the date a photo is filed under

function phDay(t, date) { // a photo date: its assessments (if any) decide which plots there are and the walking order
  const as = t.assessments.filter(a => a.date === date).sort((x, y) => (x.created || 0) - (y.created || 0));
  return { date, as, a0: as[0] || { id: null, date, apps: null, cropSets: null, data: {}, types: [] } };

/* ZIP of a date's photos (named as agreed) and a photo list; the photos are referenced, not copied, so large sets don't fill the phone's memory */
function zipOfBlobs(entries) {
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
  const dos = ts => { const d = new Date(ts); return [(d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()]; };
  entries.forEach(f => {
    const name = enc.encode(f.name), [tm, dt] = dos(f.ts || Date.now());
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true); lh.setUint16(10, tm, true); lh.setUint16(12, dt, true);
    lh.setUint32(14, f.crc, true); lh.setUint32(18, f.size, true); lh.setUint32(22, f.size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, f.blob);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, tm, true); ch.setUint16(14, dt, true);
    ch.setUint32(16, f.crc, true); ch.setUint32(20, f.size, true); ch.setUint32(24, f.size, true); ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + f.size;
  });
  const size = central.reduce((s, p) => s + p.length, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true); end.setUint32(12, size, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}
async function exportPhotosZip(t, date, btn) {
  let rs; try { rs = await photosOfDay(t, date); } catch (e) { alert(e.message); return; }
  if (!rs.length) { toast('No photos for this date yet'); return; }
  const order = new Map(phPlots(t, phDay(t, date)).map((p, i) => [p.plot, i]));
  rs.sort((x, y) => (order.get(x.plot) ?? 1e9) - (order.get(y.plot) ?? 1e9) || x.plot - y.plot || x.seq - y.seq);
  if (btn) { btn.disabled = true; btn.textContent = 'Making ZIP…'; }
  try {
    const ms = multiSet(t), hhmm = ts => new Date(ts).toLocaleTimeString('en-GB');
    const csvCell = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
    const rows = [['File', 'Trial ID', 'Date', 'Time', 'Plot', 'Rep', 'Trt', ...(ms ? ['Crop/Variety'] : [])], ...rs.map(r => [photoName(t, date, r), t.trialId, dmy(isoDay(r.ts)), hhmm(r.ts), pn(r.plot), r.rep, r.trt, ...(ms ? [cropSetName(t, r.set)] : [])])];
    const csv = new TextEncoder().encode('﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n');
    const entries = [...rs.map(r => ({ name: photoName(t, date, r), blob: r.blob, crc: r.crc, size: r.size, ts: r.ts })), { name: 'Photo list.csv', blob: new Blob([csv]), crc: crc32(csv), size: csv.length, ts: Date.now() }];
    const zip = zipOfBlobs(entries), name = `${t.trialId.replace(/[^\w.-]+/g, '_')}_Photos_${dmy(date).replace(/\//g, '-')}.zip`;
    downloadMany([{ blob: zip, name }]);
    const now = Date.now(); for (const r of rs) if (!r.exported) { r.exported = now; await photoPut(r); }
    toast(`ZIP ready – ${rs.length} photo${rs.length === 1 ? '' : 's'} (${fmtMB(zip.size)})`);
  } catch (e) { alert('Could not make the ZIP: ' + (e.message || e)); }
  finally { wirePhotosCard(t); if (btn) btn.textContent = 'Export ZIP'; }
}

        ${Array(lead).fill('<span></span>').join('')}${range(days).map(dn => { const k = isoOf(vy, vm, dn); return `<button type="button" class="cal-day${k === sel ? ' on' : ''}${k === tIso ? ' today' : ''}" data-day="${k}">${dn}</button>`; }).join('')}</div>
      <div class="cal-foot"><button type="button" class="small" data-today="1">Today</button>${onType ? '<button type="button" class="small" data-type="1">Type It In</button>' : ''}<button type="button" class="small" data-close="1">Cancel</button></div></div>`;

  $('#sig-clear').onclick = () => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore(); };

  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  const rm = $('#sig-rm'); if (rm) rm.onclick = () => { if (!confirm('Remove your signature? It will no longer appear on exported files.')) return; setSignature(null); ov.remove(); toast('Signature removed'); onDone(); };
  $('#sig-save').onclick = () => {
    const W = cv.width, H = cv.height, px = ctx.getImageData(0, 0, W, H).data;
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (px[(y * W + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 < 0) { toast('Sign in the box first'); return; }
    const m = Math.round(4 * dpr); x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(W - 1, x1 + m); y1 = Math.min(H - 1, y1 + m);
    const cw = x1 - x0 + 1, ch = y1 - y0 + 1, k = Math.min(1, 360 / cw, 120 / ch), w = Math.max(1, Math.round(cw * k)), h = Math.max(1, Math.round(ch * k));
