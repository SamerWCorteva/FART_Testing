.brand { font-family:'D-DIN','DIN Alternate','Bahnschrift','DIN 1451 Std',system-ui,sans-serif; line-height:1.05; }
.searchrow { display:flex; gap:10px; align-items:stretch; margin-bottom:14px; }
.search { flex:1; position:relative; display:block; margin:0; min-width:0; }
.search input[type=text] { padding-left:2.6rem; }
.search::before { content:''; position:absolute; left:.85rem; top:50%; width:1.05rem; height:1.05rem; transform:translateY(-50%); pointer-events:none;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23788596' stroke-width='2.4' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>") no-repeat center / contain; }
.searchrow button { flex:none; white-space:nowrap; }
.sec > summary { display:flex; align-items:center; gap:8px; cursor:pointer; list-style:none; font-size:1.05rem; font-weight:700; }
.sec > summary::-webkit-details-marker { display:none; }
.sec > summary::before { content:'▸'; color:var(--accent); }
.sec[open] > summary::before { content:'▾'; }
.sec-name { flex:1; }
.sec-btns { display:flex; gap:8px; align-items:center; margin-left:auto; }
.icon-btn { min-height:32px; width:32px; padding:0; border-radius:8px; }
.tc-link { display:block; color:inherit; text-decoration:none; }
.trial-card .mv { display:flex; align-items:center; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
.trial-card .mv select { width:auto; min-height:36px; flex:1; }
a.brand, .brand-link { color:inherit; text-decoration:none; }
.brand-link { display:block; }
.crow { display:grid; grid-template-columns:1.25fr .8fr .8fr 58px 34px; gap:6px; align-items:center; margin-bottom:6px; }
.crow.chead { font-size:.75rem; font-weight:700; color:var(--muted); margin-bottom:2px; }
.crow input[type=text], .crow input:not([type]) { min-height:42px; padding:.3rem .4rem; text-align:center; }
.crow input.err { border-color:var(--bad); background:var(--bad-soft); }
.crow input:disabled { background:var(--line); }
.crow .chk { justify-content:center; }
.map .pc.buf { background:repeating-linear-gradient(135deg, var(--bg), var(--bg) 5px, var(--line) 5px, var(--line) 6px); }
.map .pc.buf span { font-style:italic; }
/* subtle tints that show which plots belong to which rep (custom randomization only) */
:root { --rep1:#e6f0fb; --rep2:#e8f5ec; --rep3:#f3ebf9; --rep4:#fdf1de; --rep5:#e3f4f3; --rep6:#fbe8ed; }
@media (prefers-color-scheme: dark) { :root { --rep1:#1a2a3d; --rep2:#17291f; --rep3:#2a1f34; --rep4:#33281a; --rep5:#16302e; --rep6:#331d25; } }
:root[data-contrast] { --rep1:#d3e5f8; --rep2:#d4eddc; --rep3:#e6d8f3; --rep4:#fbe3b8; --rep5:#cdebe9; --rep6:#f6d3dc; }
.rp1 { --rc:var(--rep1); } .rp2 { --rc:var(--rep2); } .rp3 { --rc:var(--rep3); } .rp4 { --rc:var(--rep4); } .rp5 { --rc:var(--rep5); } .rp6 { --rc:var(--rep6); }
.map .pc[class*="rp"] { background-color:var(--rc); }
.map .pc.utc[class*="rp"] { background-image:linear-gradient(rgba(60,80,110,.2), rgba(60,80,110,.2)); outline:1.5px solid var(--utc-line); }
.rand input[class*="rp"] { background:var(--rc); }
.replegend { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.rl { display:inline-block; padding:.1rem .6rem; border-radius:999px; font-size:.78rem; border:1px solid var(--line); background:var(--rc); }
.review tr.setrow td { background:var(--bg); font-weight:700; text-align:left; padding:.4rem .5rem; }
.setname { font-weight:700; margin:12px 0 4px; }
.seg { display:flex; gap:6px; margin:4px 0 12px; }
.seg button { flex:1; min-height:42px; }
.seg button.on { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
.rand input.buf { background:repeating-linear-gradient(135deg, var(--bg), var(--bg) 5px, var(--line) 5px, var(--line) 6px); }
.datewrap { position:relative; display:block; }
.datewrap input { padding-right:3.2rem; }
.calbtn { position:absolute; right:4px; top:50%; transform:translateY(-50%); min-height:36px; width:40px; padding:0; border:0; background:transparent; color:var(--accent); border-radius:8px; }
.cal-ov { align-items:center; }
.sheet.cal { max-width:340px; border-radius:var(--radius); padding:14px; margin:0 16px; border:1px solid var(--line); }
.cal-head { display:flex; gap:6px; align-items:center; margin-bottom:10px; }
.cal-head select { flex:1; min-height:40px; padding:.3rem .5rem; width:auto; min-width:0; }
.cal-head select[data-sel="y"] { flex:.7; }
.sheet.cal .calnav { width:40px; min-height:40px; padding:0; font-size:1.4rem; flex:none; }
.sheet.cal button { width:auto; margin:0; }
.cal-grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; text-align:center; }
.cal-wd { font-size:.72rem; font-weight:700; color:var(--muted); padding:4px 0; }

<script>

const APP_VERSION = 40;
// keep APP_VERSION in step with VERSION in sw.js
const cap = s => { s = String(s ?? ''); return s.charAt(0).toUpperCase() + s.slice(1); }; // first letter capital, used for titles and headers
/* ---------- storage ---------- */
const KEY = 'fieldAssessments.v1';
const app = document.getElementById('app');
// when this device last got a new version of the app (kept apart from trial data, so it is not part of backups)
const APPINFO_KEY = 'fieldAssessments.app';
let appInfo = (() => {
  try { const x = JSON.parse(localStorage.getItem(APPINFO_KEY) || '{}'); if (x.version !== APP_VERSION) { x.version = APP_VERSION; x.installedAt = Date.now(); localStorage.setItem(APPINFO_KEY, JSON.stringify(x)); } return x; }
  catch (e) { return { version: APP_VERSION, installedAt: Date.now() }; }
})();

let homeQuery = ''; // the text in the home page search box
function applyContrast() { document.documentElement.toggleAttribute('data-contrast', !!db.settings.contrast); }
applyContrast();

function migrateDb(d) { // keeps older data and backups working
  d.trials.forEach(t => {
    if (t.crop) t.crop = t.crop.replace('(BRSNN)', '(BRSNW)');

    const g = G(), across = clamp(parseInt($('g-across').value, 10) || 1, 1, 60), up = clamp(parseInt($('g-up').value, 10) || 1, 1, 60);
    if (across === g.across && up === g.up) return;
    const lost = g.cells.some((row, r) => row.some((cell, c) => (r >= up || c >= across) && (cell.trt !== '' || cell.buf)));
    if (lost && !confirm('Making the grid smaller removes some plots you have already entered. Continue?')) { $('g-across').value = g.across; $('g-up').value = g.up; return; }
    d.sets[cur].grid = buildGrid(across, up, g.cells); autoReps(G()); drawGrid();
  };
  $('g-across').onchange = resizeGrid; $('g-up').onchange = resizeGrid;
  $('g-setname').oninput = e => { d.sets[cur].name = e.target.value; const b = $('set-bar').querySelector(`button[data-s="${cur}"]`); if (b) b.textContent = e.target.value.trim() || 'Set ' + (cur + 1); };
  $('g-autoplot').onclick = () => { const g = G(); g.cells.forEach((row, r) => row.forEach((cell, c) => { cell.plot = autoPlot(r + 1, c + 1, g.across); })); autoReps(g); layer = 'plot'; drawGrid(); toast('Plot numbers filled in'); };
  $('g-autorep').onclick = () => { const g = G(); g.cells.forEach(row => row.forEach(cell => { cell.repManual = false; })); autoReps(g); layer = 'rep'; drawGrid(); toast('Reps worked out again from the treatments'); };
  $('g-clear').onclick = () => {
    if (!confirm(`Clear everything on the ${{ plot: 'Plot No.', rep: 'Rep', trt: 'Treatment' }[layer]} tab?`)) return;
    const g = G(); g.cells.forEach(row => row.forEach(cell => { if (layer === 'trt') { cell.trt = ''; cell.buf = false; } else if (layer === 'rep') { cell.rep = ''; cell.repManual = false; } else cell.plot = ''; })); autoReps(g); drawGrid();
  };
  $('g-dup').onclick = () => { // same plot numbers again for another crop / variety
    if (!d.sets[0].name.trim() && d.sets.length === 1) { const n0 = (prompt('What is the randomization you have now called? (e.g. Barley)') || '').trim(); if (!n0) return; d.sets[0].name = n0; }
    const name = (prompt('Name of the extra crop / variety? (e.g. Wheat)') || '').trim(); if (!name) return;
    const src = G();
    d.sets.push({ name, dims: null, grid: { across: src.across, up: src.up, cells: src.cells.map(row => row.map(c => ({ ...c }))) } });
    cur = d.sets.length - 1; layer = 'plot'; drawGrid(); toast(`${name} added – change whatever differs`);
  };
  $('g-delset').onclick = () => {
    if (!confirm(`Delete "${d.sets[cur].name || 'this crop / variety'}" and its plots?${locked ? ' Any values recorded on them will no longer show.' : ''}`)) return;
    d.sets.pop(); cur = d.sets.length - 1; drawGrid();
  };
  $('c-paste-go').onclick = () => {
    const g = G(), lines = $('c-paste').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => l.split(/[\s,;]+/).filter(Boolean));
    if (!lines.length) { alert('Paste one line per row first (row 1, the bottom row, comes first).'); return; }
    const bad = [];
    lines.forEach((tokens, r) => tokens.forEach((tk, c) => {
      if (r >= g.up || c >= g.across) { bad.push(`row ${r + 1}, box ${c + 1}`); return; }
      const cell = g.cells[r][c];
      if (layer === 'trt') { if (tk === '0' || /^(b|buf|buffer)$/i.test(tk)) { cell.buf = true; cell.trt = ''; } else if (isInt(tk)) { cell.buf = false; cell.trt = Number(tk); } else bad.push(tk); }
      else if (isInt(tk)) { cell[layer] = Number(tk); if (layer === 'rep') cell.repManual = true; } else bad.push(tk);
    }));
    autoReps(g); drawGrid();
    if (bad.length) alert(`Some entries did not fit or were not numbers: ${bad.slice(0, 6).join(', ')}${bad.length > 6 ? '…' : ''}`); else toast('Pasted');
  };
  $('f-serp').onchange = () => { d.serpentine = $('f-serp').checked; };
  $('r-clear').onclick = () => { if (!confirm('Clear every plot in the randomization?')) return; d.layout = blankLayout(d.reps, d.trts); drawRand(); $('rand').querySelector('input:not(.sentinel)').focus(); };
  $('paste-go').onclick = () => {
    const N = d.reps * d.trts;
    const lines = $('paste').value.split(/\r?\n/).map(l => l.trim()).filter(l => l && /\d/.test(l));
    const nums = $('paste').value.split(/[\s,;]+/).filter(Boolean).map(Number);
    // Two columns per line (plot number, treatment) — e.g. copied from a protocol table
    const pairs = lines.map(l => l.split(/[\s,;]+/).filter(Boolean).map(Number));
    if (pairs.length === N && pairs.every(p => p.length === 2 && p.every(Number.isInteger))) {
      const map = new Map(pairs.map(([pl, k]) => [pl, k]));
      const missing = [];
      const lay = range(d.reps).map((_, r) => range(d.trts).map((_, i) => {
        const pl = plotNo(d, r, i); if (!map.has(pl)) missing.push(pl); return map.get(pl) ?? '';
      }));
      if (missing.length) { alert(`These plot numbers weren't in the pasted list: ${missing.slice(0, 10).join(', ')}${missing.length > 10 ? '…' : ''}. Check the plot numbering setting above.`); return; }
      d.layout = lay; drawRand(); toast('Randomization applied'); return;
    }
    if (nums.length !== N || nums.some(n => !Number.isInteger(n))) {
      alert(`Expected ${N} treatment numbers (${d.reps} reps × ${d.trts} treatments), or ${N} lines of "plot  treatment", but found ${nums.length} numbers.`); return;
    }
    d.layout = range(d.reps).map((_, r) => nums.slice(r * d.trts, (r + 1) * d.trts));
    drawRand(); toast('Randomization applied');
  };
  $('save').onclick = () => {
    d.trialId = $('f-id').value.trim().toUpperCase(); d.desc = $('f-desc').value.trim();
    d.type = $('f-type').value;
    d.crop = $('f-crop').value === '__other' ? $('f-crop-other').value.trim() : $('f-crop').value;
    if (!d.trialId) { alert('Please enter a Trial ID.'); $('f-id').focus(); return; }
    if (db.trials.some(t => t.id !== d.id && t.trialId.toLowerCase() === d.trialId.toLowerCase()) && !confirm(`A trial called "${d.trialId}" already exists. Save anyway?`)) return;
    const L = appLetters(d);
    d.trtApps = range(d.trts).map(k => Number(d.untreated) === k ? [] : (d.trtApps[k - 1] || []).filter(l => L.includes(l)).sort());
    if (L.length) {
      const none = range(d.trts).filter(k => Number(d.untreated) !== k && !d.trtApps[k - 1].length);
      if (none.length && !confirm(`Treatment${none.length > 1 ? 's' : ''} ${none.join(', ')} ${none.length > 1 ? 'have' : 'has'} no application ticked.\n\nSave anyway?`)) { showStep(2); return; }
    }
    if (custom()) {
      d.sets.forEach(x => { if (!x.grid) x.grid = gridFromList(d.sets.indexOf(x)); });
      const sts = d.sets.map(x => statusOf(x.grid));
      if (sts.every(x => x.total - x.bufs < 1)) { showStep(3); alert('Fill in the custom randomization first – at least one plot that is not a buffer.'); return; }
      const badIdx = sts.findIndex(x => x.bad);
      if (badIdx >= 0) {
        const st = sts[badIdx]; cur = badIdx; layer = st.errCount.plot ? 'plot' : st.errCount.trt ? 'trt' : 'rep'; showStep(3); drawGrid();
        alert(`${d.sets.length > 1 ? `"${d.sets[badIdx].name || 'Set ' + (badIdx + 1)}": ` : ''}some boxes still need filling in (Plot no.: ${st.errCount.plot}, Treatment: ${st.errCount.trt}, Rep: ${st.errCount.rep}). Every plot needs a different plot number and a treatment from 1 to ${d.trts} (or 0 for a buffer).`); return;
      }
      const warns = sts.flatMap((x, i) => x.warn.map(w => (d.sets.length > 1 ? `${d.sets[i].name || 'Set ' + (i + 1)}: ` : '') + w));
      if (warns.length && !confirm(`${warns.slice(0, 5).join('\n')}${warns.length > 5 ? '\n…' : ''}\n\nSave anyway? (If a treatment appears twice in a rep, the Review table only lists the first of those plots.)`)) return;
      const before = trial && trial.plotList ? JSON.stringify(trial.plotList) : '';
      const list = [];
      d.sets.forEach((x, si) => x.grid.cells.forEach((row, r) => row.forEach((cell, c) => list.push({ plot: Number(cell.plot), rep: cell.buf ? (Number(cell.rep) || 0) : Number(cell.rep), trt: cell.buf ? 0 : Number(cell.trt), row: r + 1, col: c + 1, set: si }))));
      d.plotList = list; d.sets = d.sets.map(x => ({ name: x.name.trim(), grid: { across: x.grid.across, up: x.grid.up } })); delete d.grid;
      d.reps = Math.max(1, ...list.filter(p => p.trt > 0).map(p => p.rep)); // reps are whatever was worked out
      if (locked && before !== JSON.stringify(d.plotList) && !confirm('This trial has data. Changing the plots will re-assign existing plot data. Continue?')) return;
    } else {
      const sts = d.layout.map(row => repStatus(row, d.trts));
      if (sts.some(s => s.blanks || s.bad)) { alert('Every plot needs a treatment number between 1 and ' + d.trts + '.'); return; }
      if (sts.some(s => !s.ok) && !confirm('Some reps do not contain each treatment exactly once. Save anyway?')) return;
      if (locked && JSON.stringify(trial.layout) !== JSON.stringify(d.layout) && !confirm('This trial has data. Changing the randomization will re-assign existing plot data to the new treatments. Continue?')) return;
      d.layout = d.layout.map(row => row.map(Number));
      delete d.plotList; delete d.grid; delete d.sets;
    }
    d.untreated = Number(d.untreated) || 0;
    d.trtNames = range(d.trts).map(k => (d.trtNames[k - 1] || '').trim());
    d.updated = Date.now();
    const i = db.trials.findIndex(t => t.id === d.id);
    if (i >= 0) db.trials[i] = d; else db.trials.push(d);
    finished = true; dropDraft(key);
    save(); toast(editing ? 'Trial saved' : 'Trial created');
    go('#/trial/' + d.id);
  };
  function goStep(n) {
    if (n > 1 && !$('f-id').value.trim()) { alert('Please enter a Trial ID first.'); showStep(1); $('f-id').focus(); return; }
    if (n > 1) resize();
    showStep(n);
    if (n === 3 && !custom()) { const e = [...$('rand').querySelectorAll('input:not(.sentinel)')].sort((x, y) => (+x.dataset.r - +y.dataset.r) || (+x.dataset.i - +y.dataset.i)).find(x => x.value === ''); if (e) e.focus(); }
  }
  app.querySelectorAll('.step').forEach(b => b.onclick = () => goStep(+b.dataset.st));
  $('w-next').onclick = () => goStep(step + 1);
  $('w-back').onclick = () => goStep(step - 1);
  /* drafts: the form is saved at every input or tap, with the step you were on */
  let finished = false;
  const collect = () => { d.trialId = $('f-id').value.trim().toUpperCase(); d.desc = $('f-desc').value; d.type = $('f-type').value; d.crop = $('f-crop').value === '__other' ? $('f-crop-other').value.trim() : $('f-crop').value; };
  const snap = () => {
    if (finished || !$('f-id')) return null; // the form is already gone
    collect(); if (!editing && !d.trialId && !d.desc.trim()) return null; // nothing worth keeping yet
    const { assessments, ...rest } = d;
    return { data: { d: JSON.parse(JSON.stringify(rest)), ui: { cur, layer } }, step };
  };
  ['input', 'change', 'click'].forEach(ev => app.querySelector('main').addEventListener(ev, e => { if (!finished && !(e.target.closest && e.target.closest('#w-cancel'))) queueDraft(key, snap); }));
  $('w-cancel').onclick = () => {
    const dirty = !!getDraft(key) || (draftPending && draftPending.key === key);
    if (dirty && !confirm(editing ? 'Discard your changes to this trial?' : 'Discard this unfinished trial? Everything you entered will be lost.')) return;
    finished = true; dropDraft(key); go(editing ? '#/trial/' + d.id : '#/');
  };
  drawNames(); drawRand(); applyMode(); showStep(draft && draft.step ? draft.step : 1);
  if (!editing && !draft) $('f-id').focus();
}

/* ---------- TRIAL DETAIL ---------- */
function viewTrial(t) {
  const as = [...t.assessments].sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.created - a.created);
  const trDraft = getDraft('trial:' + t.id), newDraft = getDraft(`assess:${t.id}:new`);
  app.innerHTML = `
  <header class="top"><a class="back" href="#/">← Trials</a><h1>${esc(t.trialId)}</h1><a class="brand sm" href="#/" aria-label="FART – back to the home page"><b>FART</b><span>Field Assessment Recording Tool</span></a></header>
  <main>
    ${t.desc ? `<p class="muted">${esc(t.desc)}</p>` : ''}
    ${(t.type || t.crop || t.archived) ? `<div class="pills" style="margin:0 0 .5rem">${t.archived ? '<span class="pill warn">Archived</span>' : ''}${t.type ? `<span class="pill">${esc(t.type)}</span>` : ''}${t.crop ? `<span class="pill">${esc(t.crop)}</span>` : ''}</div>` : ''}
    <p class="small muted">${trialLine(t)} · ${t.serpentine ? 'Serpentine Walk' : 'Walk in Plot Order'}</p>
    ${trDraft ? `<div class="card draftcard"><h3>Unsaved Changes to This Trial</h3><div class="small">Saved ${savedAgo(trDraft.saved)}</div>
      <div class="actions" style="margin:10px 0 0"><a class="btn primary small" href="#/trial/${t.id}/edit">Continue</a><button class="small" id="dr-trial-x" type="button">Discard</button></div></div>` : ''}
    ${newDraft ? `<div class="card draftcard"><h3>Unfinished Assessment Date</h3><div class="small">${esc(newDraft.data.dateTxt || dmy(newDraft.data.d.date))} · Saved ${savedAgo(newDraft.saved)}</div>
      <div class="actions" style="margin:10px 0 0"><a class="btn primary small" href="#/trial/${t.id}/a/new">Continue</a><button class="small" id="dr-assess-x" type="button">Discard</button></div></div>` : ''}
    <div class="actions">
      <a class="btn primary" href="#/trial/${t.id}/a/new">+ New Assessment Date</a>
      <button id="xl" ${t.assessments.length ? '' : 'disabled'}>Export All…</button>
      <button id="share">Share Trial</button>
      <label class="btn">Import Assessment<input type="file" class="import-assess" accept=".json,application/json" hidden></label>
      <a class="btn" href="#/trial/${t.id}/edit">Edit Trial</a>
      <button id="arch">${t.archived ? 'Unarchive' : 'Archive Trial'}</button>
    </div>

    <h2 style="margin:20px 0 4px">Assessment Dates</h2>
    <p class="small muted" style="margin-bottom:12px">Add a date, describe the assessments for it, then start assessing.</p>
    ${as.length ? as.map(a => {
      const n = nPlots(t, a), done = countDone(t, a);
      const miss = a.types.length ? visitMissing(t, a) : 0, started = a.types.length > 0 && (done > 0 || scopedPlots(t, a).some(p => plotStarted(a, p.plot)));
      const status = !a.types.length ? ['No Assessments Yet', '', 'new'] : miss === 0 ? ['✓ Complete', 'ok', 'complete'] : started ? ['In Progress', '', 'part'] : ['Not Started', '', 'new'];
      const canLock = a.locked || (a.types.length && miss === 0), unsaved = getDraft(`assess:${t.id}:${a.id}`);
      return `<section class="card visit ${status[2]}">
        <div class="vhead">
          <div><div class="vdate">${esc(dmy(a.date))}</div>
            <div class="small muted">${[a.assessor, a.cropBBCH ? `BBCH ${a.cropBBCH}${(a.cropBBCHMin || a.cropBBCHMax) ? ` (${a.cropBBCHMin || '–'}–${a.cropBBCHMax || '–'})` : ''}` : ''].filter(Boolean).map(esc).join(' · ')}</div></div>
          <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center"><span class="pill ${status[1]}">${status[0]}</span>${canLock ? `<button class="ibtn" data-${a.locked ? 'unlock' : 'lock'}="${a.id}" title="${a.locked ? 'Locked – tap to unlock' : 'Lock this date'}" aria-label="${a.locked ? 'Unlock this date' : 'Lock this date'}" type="button">${a.locked ? ICON.lock : ICON.unlock}</button>` : ''}</span>
        </div>
        ${(appLetters(t).length || unsaved) ? `<div class="pills" style="margin:0 0 .5rem">${appLetters(t).length ? `<span class="pill">${esc(scopeText(t, a))}</span>` : ''}${unsaved ? '<span class="pill warn">Unsaved Changes</span>' : ''}</div>` : ''}
        ${a.types.length ? `<div class="bar"><div style="width:${n ? done / n * 100 : 0}%"></div></div>
          <div class="small muted">${done} of ${n} Plots Complete${miss ? ` · ${miss} Value${miss === 1 ? '' : 's'} Still to Enter` : ''}</div>
          <details class="vlist"><summary>${a.types.length} Assessment${a.types.length === 1 ? '' : 's'}</summary>
            <ol>${a.types.map(ty => `<li>${esc(typeLabel(ty))}</li>`).join('')}</ol></details>` : ''}
        <div class="actions" style="margin:12px 0 0">
          <a class="btn primary" href="#/trial/${t.id}/a/${a.id}${a.types.length && miss === 0 ? '/review' : ''}">${!a.types.length ? 'Add Assessments' : miss === 0 ? 'Open' : started ? 'Continue' : 'Start Assessing'}</a>
          <a class="btn" href="#/trial/${t.id}/a/${a.id}/review">Review</a>
          <button data-xp="${a.id}">Export</button>
          <button data-sh="${a.id}">Share</button>
          ${a.locked ? '' : `<a class="btn" href="#/trial/${t.id}/a/${a.id}/edit">Edit</a>`}
        </div>
        ${a.locked ? '' : `<div class="vfoot"><button class="ibtn danger" data-del="${a.id}" title="Delete this date" aria-label="Delete this date" type="button">${ICON.trash}</button></div>`}
      </section>`;
    }).join('') : `<div class="card empty"><p>No assessment dates yet.</p><a class="btn primary" href="#/trial/${t.id}/a/new">+ New Assessment Date</a></div>`}

    <section class="card">
      <h2>Field Layout</h2>
      <p class="small muted">Plot number and treatment for each plot.${t.untreated ? ' <span class="pill" style="background:var(--utc-bg);color:var(--ink)">Untreated = Darker</span>' : ''}</p>
      ${layoutSets(t).slice().reverse().map(st => `${st.name ? `<div class="setname">${esc(st.name)}</div>` : ''}<div class="scroll"><table class="map"><tbody>
        ${st.rows.map(row => `<tr>${row.label ? `<th class="l">${row.label}</th>` : ''}${row.cells.map(c => c.trt ? `<td><span class="pc ${c.trt === t.untreated ? 'utc' : ''} ${isCustom(t) ? repClass(c.rep) : ''}"><b>${c.plot}</b><span>T${c.trt}${isCustom(t) ? '' : (c.trt === t.untreated ? ' · UTC' : '')}</span></span></td>` : `<td><span class="pc buf"><b>${c.plot}</b><span>Buffer</span></span></td>`).join('')}</tr>`).reverse().join('')}
      </tbody></table></div>${isCustom(t) ? `<div class="replegend">${[...new Set(st.rows.flatMap(r => r.cells.filter(c => c.trt).map(c => c.rep)))].sort((x, y) => x - y).map(rp => `<span class="rl ${repClass(rp)}">Rep ${rp}</span>`).join('')}</div>` : ''}`).join('')}
      ${(t.trtNames.some(Boolean) || appLetters(t).length) ? `<p class="small" style="margin-top:12px">${range(t.trts).map(k => `<b>T${k}</b> ${esc(trtName(t, k) || '—')}${k === t.untreated ? ' (UTC)' : ''}${appLetters(t).length && k !== t.untreated ? ` <span class="muted">[${esc(trtApps(t, k).join(', ') || 'No Application')}]</span>` : ''}`).join(' · ')}</p>` : ''}
    </section>
    <div class="card subtle" style="padding:12px;margin:16px 0 0">
      ${db.sections.length ? `<label class="field" style="margin:0;max-width:340px"><span>Home Page Section</span><select id="sec-sel">${secOpts(t.section)}</select></label>
        <p class="small muted" style="margin:.4rem 0 0">Only decides where this trial is listed on the home page. It doesn't change the trial or its data.</p>`
      : `<p class="small muted" style="margin:0"><b>Home Page Section:</b> none yet. Sections are created on the home page and only group the trial list there.</p>`}
    </div>
    <button id="del" class="dangerzone" type="button">Delete Trial</button>
  </main>`;
  document.getElementById('xl').onclick = () => openExport(t, null);
  document.getElementById('share').onclick = () => shareTrial(t);
  const x1 = document.getElementById('dr-trial-x'); if (x1) x1.onclick = () => { if (confirm('Discard your unsaved changes to this trial?')) { dropDraft('trial:' + t.id); viewTrial(t); } };
  const x2 = document.getElementById('dr-assess-x'); if (x2) x2.onclick = () => { if (confirm('Discard this unfinished assessment date?')) { dropDraft(`assess:${t.id}:new`); viewTrial(t); } };
  app.querySelectorAll('input.import-assess').forEach(inp => inp.onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try { const d = JSON.parse(await f.text()); if (importAssessment(d, t)) viewTrial(t); } catch (err) { alert('That file is not a shared FART assessment.'); }
  });
  app.querySelectorAll('[data-sh]').forEach(b => b.onclick = () => shareAssessment(t, t.assessments.find(x => x.id === b.dataset.sh)));
  app.querySelectorAll('[data-lock],[data-unlock]').forEach(b => b.onclick = () => toggleLock(t, t.assessments.find(x => x.id === (b.dataset.lock || b.dataset.unlock)), () => viewTrial(t)));
  app.querySelectorAll('[data-xp]').forEach(b => b.onclick = () => openExport(t, t.assessments.find(x => x.id === b.dataset.xp)));
  const secSel = document.getElementById('sec-sel');
  if (secSel) secSel.onchange = () => { if (secSel.value) t.section = secSel.value; else delete t.section; save(); toast('Home page section updated'); };
  document.getElementById('arch').onclick = () => {
    if (t.archived) { delete t.archived; t.updated = Date.now(); save(); toast('Trial unarchived'); viewTrial(t); return; }
    const open = t.assessments.filter(a => !a.types.length || countDone(t, a) < nPlots(t, a)).length;
    if (!confirm(`Archive ${t.trialId}?${open ? `\n\n${open} assessment date${open > 1 ? 's are' : ' is'} not finished yet.` : ''}\n\nIt moves to "Archived Trials" on the home screen. Nothing is deleted and you can unarchive it any time.`)) return;
    t.archived = Date.now(); save(); toast('Trial archived'); go('#/');
  };
  document.getElementById('del').onclick = () => {
    if (!confirm(`Delete trial "${t.trialId}" and all of its assessment data? This cannot be undone.`)) return;
    dropTrialDrafts(t.id); db.trials = db.trials.filter(x => x.id !== t.id); save(); go('#/');
  };
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const a = t.assessments.find(x => x.id === b.dataset.del);
    if (!confirm(`Delete the ${dmy(a.date)} assessment and its data?`)) return;
    dropDraft(`assess:${t.id}:${a.id}`); t.assessments = t.assessments.filter(x => x.id !== a.id); t.updated = Date.now(); save(); viewTrial(t);
  });
}

/* ---------- ASSESSMENT SETUP (step 1: date & crop stage, step 2: describe + add assessments) ---------- */
const STAGE_FIELDS = ['stage', 'stageMin', 'stageMax', 'sizeH', 'sizeW', 'sizeUnit', 'stageOther'];
function pestCodeBox(ty, i) { // fungicide pests: pick Mixed / LESVIS / PYCVIS / PUSVIS, or type another
  const other = ty.stageOther || (ty.stage && !PEST_CODES.includes(ty.stage));

  const $ = id => document.getElementById(id);

  /* describe: select assessments (several allowed), weeds/pests and leaf levels, then Add */

  function drawTypes() {
    const n = d.types.length;
    const weeds = new Set(d.types.filter(x => x.kind === 'weed').map(x => x.target)).size, pests = new Set(d.types.filter(x => x.kind === 'pest').map(x => x.target)).size;
    $('sum').textContent = n ? `${n} assessment${n > 1 ? 's' : ''} added${weeds ? ` · ${weeds} weed${weeds > 1 ? 's' : ''}` : ''}${pests ? ` · ${pests} pest${pests > 1 ? 's' : ''}` : ''}` : '';
    $('types').innerHTML = d.types.map(cardHtml).join('') || `<p class="muted">Nothing added yet. Describe an assessment above and tap <b>+ Add Assessment</b>.</p>`;
    $('types').querySelectorAll('input[data-f],select[data-f]').forEach(inp => inp.oninput = () => {
      const i = +inp.dataset.i, f = inp.dataset.f, ty = d.types[i]; ty[f] = inp.value;
      if (STAGE_FIELDS.includes(f) && needsStage(ty)) d.types.forEach((o, j) => { if (j !== i && o.target === ty.target && o.kind === ty.kind) { o[f] = inp.value; const el = $('types').querySelector(`input[data-i="${j}"][data-f="${f}"]`); if (el) el.value = inp.value; } });
    });
    $('types').querySelectorAll('input[data-c]').forEach(cb => cb.onchange = () => { d.types[+cb.dataset.i][cb.dataset.c] = cb.checked; drawTypes(); });
    $('types').querySelectorAll('select[data-pp]').forEach(sel => sel.onchange = () => {
      const i = +sel.dataset.pp, ty = d.types[i], other = sel.value === '__other', stage = other ? '' : sel.value;
      d.types.forEach(o => { if (o.target === ty.target && o.kind === ty.kind) { o.stage = stage; o.stageOther = other; } });
      drawTypes(); if (other) { const el = $('types').querySelector(`input[data-i="${i}"][data-f="stage"]`); if (el) el.focus(); }
    });
    $('types').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if (removeType(+b.dataset.rm)) drawTypes(); });
  }
  const addFrom = s => addIfNew({ ...blankType(), name: s.name, unit: s.unit || '', min: s.min ?? '', max: s.max ?? '', target: s.target || '', kind: s.kind || '', needStage: s.needStage, stageMode: s.stageMode || '', phyto: !!s.phyto, leaf: s.leaf || '', atype: s.atype || '', untreatedOnly: !!s.untreatedOnly, subs: subsOf(s) }); // growth stages are entered again for this date
  app.querySelectorAll('[data-pt]').forEach(b => b.onclick = () => { const [pi, ti] = b.dataset.pt.split('.').map(Number); toast(addFrom(prevAs[pi].types[ti]) ? 'Added' : 'Already added'); drawTypes(); });
  app.querySelectorAll('[data-pall]').forEach(b => b.onclick = () => { let n = 0; prevAs[+b.dataset.pall].types.forEach(ty => { if (addFrom(ty)) n++; }); drawTypes(); toast(n ? `Added ${n} assessment${n > 1 ? 's' : ''}` : 'Already added'); });

  function commit(startAfter) {
    d.date = parseDmy($('a-date').value); d.assessor = $('a-who').value.trim().toUpperCase(); d.notes = $('a-notes').value.trim();
    d.cropBBCH = $('a-bbch').value.trim(); d.cropBBCHMin = $('a-bbch-min').value.trim(); d.cropBBCHMax = $('a-bbch-max').value.trim();
    if (!d.date) { showStep(1); alert('Please enter the date as DD/MM/YYYY.'); $('a-date').focus(); return; }
    if (!d.cropBBCH) { showStep(1); alert('Please enter the crop growth stage (BBCH) – the majority value.'); $('a-bbch').focus(); return; }
    const tr = v => String(v ?? '').trim();
    d.types = d.types.map(ty => ({ ...ty, name: tr(ty.name), unit: tr(ty.unit), min: tr(ty.min), max: tr(ty.max), stage: tr(ty.stage), stageMin: tr(ty.stageMin), stageMax: tr(ty.stageMax), sizeH: tr(ty.sizeH), sizeW: tr(ty.sizeW), subs: subsOf(ty), atype: tr(ty.atype) })).filter(ty => ty.name);
    if (startAfter && !d.types.length) { showStep(2); alert('Add at least one assessment first.'); return; }
    const noStage = d.types.filter(ty => needsStage(ty) && !ty.stage);
    if (noStage.length) {
      showStep(2); drawTypes();
      alert('Please choose or enter the growth stage for: ' + [...new Set(noStage.map(ty => ty.target))].join(', '));
      const el = $('types').querySelector(`input[data-i="${d.types.indexOf(noStage[0])}"][data-f="stage"]`) || $('types').querySelector(`select[data-pp="${d.types.indexOf(noStage[0])}"]`); if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); }
      return;
    }
    if (d.apps && !d.apps.length) { showStep(1); alert('No plots are covered by the applications chosen. Tick at least one application, or choose All Applications.'); return; }
    const names = d.types.map(ty => typeLabel(ty).toLowerCase());
    if (new Set(names).size !== names.length) { showStep(2); alert('Two assessments have the same name and unit. Please make them distinct.'); return; }
    if (t.type === 'Herbicide' && t.untreated && d.types.length && !d.types.some(ty => ty.kind === 'weed' && /count/i.test(ty.name)) // any weed count (general or untreated) means no reminder
      && !confirm('Are you sure you do not require a Untreated Weed Count for this assessment date?')) { showStep(2); return; }
    // drop data for removed assessments
    const ids = new Set(d.types.map(ty => ty.id));
    Object.values(d.data).forEach(r => Object.keys(r).forEach(k => { const base = k.startsWith('_s_') ? k.slice(3) : k; if (k !== '_note' && k !== '_na' && !ids.has(base)) delete r[k]; }));
    db.settings.assessor = d.assessor;
    if (!d.device) stampAssessment(d); // remembers which device (and so whose signature) made this date
    const i = t.assessments.findIndex(x => x.id === d.id);
    if (i >= 0) t.assessments[i] = d; else t.assessments.push(d);
    finished = true; dropDraft(key);
    t.updated = Date.now(); save();
    if (startAfter) go(`#/trial/${t.id}/a/${d.id}/plot/${firstIncomplete(t, d)}`);
    else { toast('Saved'); go(`#/trial/${t.id}`); }
  }
  $('a-start').onclick = () => commit(true);
  $('a-save').onclick = () => commit(false);
  /* drafts: the form is saved at every input or tap, with the step you were on */
  let finished = false;
  const collectFields = () => {
    d.assessor = $('a-who').value.trim().toUpperCase(); d.notes = $('a-notes').value.trim();
    d.cropBBCH = $('a-bbch').value.trim(); d.cropBBCHMin = $('a-bbch-min').value.trim(); d.cropBBCHMax = $('a-bbch-max').value.trim();
    d.date = parseDmy($('a-date').value) || d.date;
  };
  const snap = () => {
    if (finished || !$('a-date')) return null; // the form is already gone
    collectFields(); if (!editing && !d.cropBBCH && !d.types.length && !d.notes && !d.apps) return null; // nothing worth keeping yet
    const { data, ...rest } = d;
    return { data: { d: JSON.parse(JSON.stringify(rest)), dateTxt: $('a-date').value }, step };
  };
  app.querySelector('main').addEventListener('input', watch); app.querySelector('main').addEventListener('change', watch);
  app.querySelector('main').addEventListener('click', e => { if (!(e.target.closest && e.target.closest('#w-cancel'))) watch(); });
  $('w-cancel').onclick = () => {
    const dirty = !!getDraft(key) || (draftPending && draftPending.key === key);
    if (dirty && !confirm(editing ? 'Discard your changes to this assessment date?' : 'Discard this unfinished assessment date? Everything you entered will be lost.')) return;
    finished = true; dropDraft(key); go(back);
  };
  drawMenu(); drawBuilder(); drawTypes(); drawScope(); showStep(step);
}

/* ---------- DATA ENTRY (one plot per page) ---------- */
function viewEntry(t, a, idx, focusAt, keepScroll) {
  const order = walkOrder(t, a);
  if (!order.length) { toast('No plots are covered by the applications chosen for this date'); return goReplace(`#/trial/${t.id}`); }
  idx = clamp(idx, 0, order.length - 1);
  const p = order[idx];
  const last = order.length - 1;
  const done = countDone(t, a);
  const show = !!db.settings.showTrt;
  const rec = a.data[p.plot] || {};
  const base = `#/trial/${t.id}/a/${a.id}`;
  const hintOf = ty => (ty.min !== '' || ty.max !== '') ? `${ty.min !== '' ? ty.min : '…'} to ${ty.max !== '' ? ty.max : '…'}` : ''; // range only; the unit is shown beside the box

  const na = isNA(a, p.plot), locked = !!a.locked;
  const fieldHtml = (ty, i) => {
    if (ty.untreatedOnly) return ''; // untreated counts are entered at the end in Review, so the untreated plots aren't revealed
    if (ty.noPhyto) return `<div class="nophyto">${esc(typeTitle(ty))}: No phyto (0 on every plot)</div>`;
    const hint = hintOf(ty), n = subsOf(ty);
    if (locked) { const v = n > 1 ? ((rec['_s_' + ty.id] || []).filter(x => x !== '').join(' / ')) : val(a, p.plot, ty.id); return `<div class="field entry-field"><span style="display:block;font-weight:600;margin-bottom:.3rem">${esc(typeTitle(ty))}</span><div class="rovalue">${esc(v || '–')}${v && ty.unit ? ' ' + esc(ty.unit) : ''}</div></div>`; }
    if (na) return '';
    if (n > 1) {
      const arr = rec['_s_' + ty.id] || [];
      return `<div class="field entry-field"><span style="display:block;font-weight:600;margin-bottom:.3rem">${esc(typeTitle(ty))}${ty.unit ? ` <b style="color:var(--accent)">${esc(ty.unit)}</b>` : ''} <span class="hint">(${esc(hint ? hint + ' · ' : '')}${n} subsamples)</span></span>
        <div class="subgrid">${range(n).map(k => `<input class="ev" data-t="${ty.id}" data-i="${i}" data-k="${k - 1}" value="${esc(arr[k - 1] ?? '')}" inputmode="decimal" enterkeyhint="next" autocomplete="off" aria-label="Subsample ${k}" placeholder="${k}">`).join('')}</div>
        <div class="small muted" style="margin-top:4px;text-align:center">Mean: <b id="mean-${i}">${esc(rec[ty.id] ?? '–')}</b></div></div>`;
    }
    return `<label class="field entry-field"><span>${esc(typeTitle(ty))} ${hint ? `<span class="hint">(${esc(hint)})</span>` : ''}</span>
      <div class="inwrap"><input class="ev" data-t="${ty.id}" data-i="${i}" value="${esc(rec[ty.id] ?? '')}" inputmode="decimal" enterkeyhint="next" autocomplete="off">${ty.unit ? `<span class="sfx">${esc(ty.unit)}</span>` : ''}</div></label>`;
  };

  const inner = `
  <header class="top"><a class="back" href="#/trial/${t.id}">← ${esc(t.trialId)}</a><span class="spacer"></span>
    <a class="btn small" href="${base}/review">Review</a><a class="brand sm" href="#/" aria-label="FART – back to the home page"><b>FART</b><span>Field Assessment Recording Tool</span></a></header>
  <main class="entry">
    <div class="bar"><div style="width:${done / order.length * 100}%"></div></div>
    <div class="small muted"><b>${esc(dmy(a.date))}</b> · ${done} of ${order.length} Plots Complete · Page ${idx + 1} of ${order.length}</div>

    <section class="card plot-card" style="margin-top:8px">
      <span class="plot-no">Plot ${pn(p.plot)}</span>${multiSet(t) ? `<span class="pill">${esc(setName(t, p.set))}</span>` : ''}
      <span class="plot-meta">Rep <b>${p.rep}</b>${show ? ` · <b>${esc(trtLabel(t, p.trt))}</b>` : ''}</span>
      <span id="badge" class="done-badge"></span>
    </section>

    <form id="ef" onsubmit="return false" autocomplete="off">
    ${kb.sentinel('prev')}
    <section class="card">
      ${locked ? '<div class="nophyto">🔒 This date is locked. Unlock it from the trial page or Review to edit.</div>' : ''}${na && !locked ? '<div class="nophyto">Plot not assessed – recorded as NA</div>' : ''}
      ${a.types.map(fieldHtml).join('')}
      ${kb.sentinel('next')}
      <label class="field" style="margin-bottom:0"><span>Plot Note <span class="hint muted" style="font-weight:400">(optional – tap to add)</span></span>
        <input id="note" tabindex="-1" ${locked ? 'disabled' : ''} value="${esc(rec._note || '')}" enterkeyhint="done" autocomplete="off"></label>
    </section>
    </form>

    <div class="actions" style="justify-content:space-between;align-items:center">
      <label class="small" style="display:flex;gap:.5rem;align-items:center">Go To
        <select id="jump" style="width:auto;min-height:36px">${order.map((q, j) =>
          `<option value="${j}" ${j === idx ? 'selected' : ''}>${plotTag(t, q.plot)} · Rep ${q.rep}${plotComplete(t, a, q.plot) ? ' ✓' : plotStarted(a, q.plot) ? ' …' : ''}</option>`).join('')}</select></label>
      <span style="display:flex;gap:14px;flex-wrap:wrap">
        ${locked ? '' : `<label class="chk small"><input type="checkbox" id="na" ${na ? 'checked' : ''}> Plot Not Assessed</label>`}
        <label class="chk small"><input type="checkbox" id="sun" ${db.settings.contrast ? 'checked' : ''}> ☀ High Contrast</label>
        <label class="chk small"><input type="checkbox" id="serp" ${(a.serpentine !== undefined ? a.serpentine : t.serpentine) ? 'checked' : ''}> Serpentine</label>
        <label class="chk small"><input type="checkbox" id="showTrt" ${show ? 'checked' : ''}> Show Treatment</label>
      </span>
    </div>

  </main>
  <div class="navbtns">
    <button id="prev" ${idx === 0 ? 'disabled' : ''}>← Back</button>
    <button id="next" class="primary">Next →</button>
  </div>`;
  // moving from plot to plot swaps the contents of the same screen, so the keyboard and scroll position stay put
  const shellOld = keepScroll && document.getElementById('shell');
  if (shellOld) { const m0 = shellOld.querySelector('main.entry'), st0 = m0 ? m0.scrollTop : 0; shellOld.innerHTML = inner; const m1 = shellOld.querySelector('main.entry'); if (m1) m1.scrollTop = st0; }
  else app.innerHTML = `<div class="shell" id="shell">${inner}</div>`;

  const inputs = [...app.querySelectorAll('input.ev')];
  const note = document.getElementById('note');
  function check() {
    inputs.forEach(inp => {
      const ty = a.types[inp.dataset.i]; const s = outOfRange(ty, inp.value.trim());
      inp.classList.toggle('bad', s === 'bad'); inp.classList.toggle('warn', s === 'warn');
    });

  }
  const rowFor = () => a.data[p.plot] || (a.data[p.plot] = {});
  const tidy = () => { if (a.data[p.plot] && !Object.keys(a.data[p.plot]).length) delete a.data[p.plot]; t.updated = Date.now(); save(); check(); };
  function store(key, v) {
    v = v.trim(); const r = rowFor();
    if (v === '') delete r[key]; else r[key] = v;
    tidy();
  }
  function storeSub(inp) {
    const ty = a.types[inp.dataset.i];
    const m = setSubValue(a, p.plot, ty, +inp.dataset.k, inp.value);
    const el = document.getElementById('mean-' + inp.dataset.i); if (el) el.textContent = m ?? '–';
    tidy();
  }
  const fields = inputs; // the notes box is outside the Next / arrow sequence
  const kbOpen = () => fields.includes(document.activeElement) || document.activeElement === note;
  // Draw the next plot in place (no hash change event) and refocus, so the keyboard stays open.
  function goPlot(to, at) {
    history.replaceState(null, '', `${base}/plot/${to}`);
    viewEntry(t, a, to, at, true);
  }
  function warnRange() { if (inputs.some(inp => outOfRange(a.types[inp.dataset.i], inp.value.trim()) === 'bad')) toast('A value is outside its expected range'); }
  function nextPlot(at) {
    warnRange();
    if (idx === last) go(`${base}/review`); else goPlot(idx + 1, at);
  }
  function prevPlot(at) { if (idx > 0) goPlot(idx - 1, at); }
  function step(dir) {
    if (document.activeElement === note) { if (dir === 'down' || dir === 'right') nextPlot(0); else if (fields.length) fields[fields.length - 1].focus(); return; }
    if (!fields.length) { if (dir === 'down' || dir === 'right') nextPlot(undefined); else prevPlot(undefined); return; }
    const f = Math.max(fields.indexOf(document.activeElement), 0);
    if (dir === 'down') { if (f < fields.length - 1) fields[f + 1].focus(); else nextPlot(0); }
    else if (dir === 'up') { if (f > 0) fields[f - 1].focus(); else prevPlot(fields.length - 1); }
    else if (dir === 'right') nextPlot(f);
    else if (dir === 'left') prevPlot(f);
  }
  inputs.forEach(inp => {
    inp.oninput = () => inp.dataset.k !== undefined ? storeSub(inp) : store(inp.dataset.t, inp.value);
    inp.onfocus = () => setTimeout(() => inp.select(), 0);
    inp.onkeydown = e => { if (kb.key(e)) return; if (e.key === 'Enter') { e.preventDefault(); step('down'); } };
  });
  note.oninput = () => store('_note', note.value);
  note.onkeydown = e => { if (kb.key(e)) return; if (e.key === 'Enter') { e.preventDefault(); note.blur(); } };
  kb.use({ dirs: ['left', 'right', 'up', 'down'], go: step }, [...fields, note]);
  // The phone's own Previous / Next arrows run through hidden boxes before and after, so they carry on across plots
  app.querySelector('[data-sent="prev"]').onfocus = () => { if (idx > 0) prevPlot(fields.length - 1); else if (fields.length) fields[0].focus(); };
  app.querySelector('[data-sent="next"]').onfocus = () => { if (idx < last) nextPlot(0); else if (fields.length) fields[fields.length - 1].focus(); };
  // Next goes through the assessments on this plot first, then on to the next plot. Back does the reverse.
  const nextBtn = document.getElementById('next');
  const nextText = () => { const f = fields.indexOf(document.activeElement); return (f === fields.length - 1 || document.activeElement === note) ? (idx === last ? 'Finish → Review' : 'Next Plot →') : 'Next →'; };
  const setNext = () => { nextBtn.textContent = nextText(); };
  fields.forEach(f => f.addEventListener('focus', setNext)); note.addEventListener('focus', setNext);
  // bring the box you move to into the middle of the visible area, clear of the keyboard
  [...fields, note].forEach(el => el.addEventListener('focus', () => { ensureVisible(el); setTimeout(() => { if (document.activeElement === el) ensureVisible(el); }, 380); }));
  ['prev', 'next'].forEach(id => document.getElementById(id).addEventListener('mousedown', e => e.preventDefault()));
  nextBtn.onclick = () => { if (fields.includes(document.activeElement) || document.activeElement === note) step('down'); else if (fields.length) fields[0].focus(); else nextPlot(undefined); };
  document.getElementById('prev').onclick = () => { if (fields.includes(document.activeElement)) step('up'); else if (document.activeElement === note) step('up'); else prevPlot(undefined); };
  document.getElementById('jump').onchange = e => goReplace(`${base}/plot/${e.target.value}`);
  const naBox = document.getElementById('na');
  if (naBox) naBox.onchange = e => {
    const r = rowFor();
    if (e.target.checked) {
      if (Object.keys(r).some(k => k !== '_note' && k !== '_na') && !confirm('Clear the values recorded for this plot and mark it as not assessed?')) { e.target.checked = false; return; }
      Object.keys(r).forEach(k => { if (k !== '_note') delete r[k]; }); r._na = true;
    } else delete r._na;
    if (!Object.keys(r).length) delete a.data[p.plot];
    t.updated = Date.now(); save(); viewEntry(t, a, idx);
  };
  document.getElementById('sun').onchange = e => { db.settings.contrast = e.target.checked; applyContrast(); save(); };
  document.getElementById('serp').onchange = e => { // switch walking order part-way through; stay on this plot
    a.serpentine = e.target.checked; t.updated = Date.now(); save();
    goPlot(walkOrder(t, a).findIndex(q => q.plot === p.plot), undefined);
    toast(a.serpentine ? 'Serpentine walk on' : 'Walking in plot order');
  };
  document.getElementById('showTrt').onchange = e => { db.settings.showTrt = e.target.checked; save(); viewEntry(t, a, idx); };
  kb.shell(document.getElementById('shell'));
  check();
  if (focusAt != null && fields.length) { const el = fields[Math.min(focusAt, fields.length - 1)]; el.focus({ preventScroll: true }); ensureVisible(el); }
  else { const firstEmpty = inputs.find(inp => inp.value === '') || null; if (firstEmpty && matchMedia('(pointer:fine)').matches) firstEmpty.focus({ preventScroll: true }); }
}

/* ---------- box plot (SVG) ---------- */
function quantile(sorted, q) { const pos = (sorted.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos); return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo); }
function boxPlotSvg(t, a, ty, sel, si, scale) { // sel = { plot, t } highlights one point; scale = 'fit' (zoom to the data) or 'full' (assessment min to max)
  const st = typeStats(t, a, ty, si);
  const cols = range(t.trts).filter(k => applies(t, ty, k, a)).map(k => { const vals = st.groups[k].vals.filter(v => v.n != null); return { k, vals, v: vals.map(x => x.n).sort((x, y) => x - y) }; });
  const all = cols.flatMap(c => c.v);
  const title = `<h3 style="margin:16px 0 4px">${esc(typeLabel(ty))}${multiSet(t) ? ' – ' + esc(setName(t, si)) : ''}</h3>`;
  if (!all.length) return `<div class="bp">${title}<p class="small muted">No values yet.</p></div>`;
  let lo = Math.min(...all), hi = Math.max(...all);
  if (scale === 'full') { // the whole scale of the assessment, e.g. 0–100 %; no padding
    const mn = num(ty.min), mx = num(ty.max);
    lo = Math.min(mn != null ? mn : 0, lo); if (mx != null) hi = Math.max(mx, hi);
    if (hi <= lo) hi = lo + 1;
  } else {
    if (lo === hi) { lo -= 1; hi += 1; }
    const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  }
  const colW = 46, L = 44, T = 10, B = 34, H = 210;
  const W = L + cols.length * colW + 8, plotH = H - T - B;
  const y = v => T + plotH - (v - lo) / (hi - lo) * plotH;
  const nice = v => String(round(v, Math.abs(hi - lo) < 5 ? 2 : Math.abs(hi - lo) < 50 ? 1 : 0));
  let g = ty.unit ? `<text x="4" y="9">${esc(ty.unit)}</text>` : '', pts = '', picked = null;
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; g += `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${nice(v)}</text>`; }
  cols.forEach((c, i) => {
    const cx = L + colW * i + colW / 2, bw = 24;
    g += `<text x="${cx}" y="${H - 14}" text-anchor="middle">T${c.k}${c.k === t.untreated ? '·UTC' : ''}</text>`;
    if (!c.v.length) return;
    const q1 = quantile(c.v, .25), med = quantile(c.v, .5), q3 = quantile(c.v, .75), mn = c.v[0], mx = c.v[c.v.length - 1];
    g += `<line x1="${cx}" x2="${cx}" y1="${y(mn)}" y2="${y(mx)}" stroke="var(--accent)" stroke-width="1.5"/>
      <line x1="${cx - 7}" x2="${cx + 7}" y1="${y(mn)}" y2="${y(mn)}" stroke="var(--accent)" stroke-width="1.5"/><line x1="${cx - 7}" x2="${cx + 7}" y1="${y(mx)}" y2="${y(mx)}" stroke="var(--accent)" stroke-width="1.5"/>
      <rect x="${cx - bw / 2}" y="${y(q3)}" width="${bw}" height="${Math.max(1, y(q1) - y(q3))}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" rx="2"/>

function download(blob, name) {

  try {

    let found = false; const onFound = () => { found = true; };

    reg.removeEventListener('updatefound', onFound);

    if (found || reg.installing || reg.waiting) {

  const msg = {

    ready: '✓ Ready to work offline. No internet needed from now on.',
    checking: 'Saving the app to this device for offline use…',
    none: '⚠ This browser can’t save the app for offline use. Open it in Safari (iPhone/iPad) or Chrome.',
  }[offlineState];
  el.textContent = msg;
  el.className = 'small ' + (offlineState === 'ready' || offlineState === 'file' ? 'rep-ok' : offlineState === 'none' ? 'rep-bad' : 'muted');
}
if (location.protocol.startsWith('http')) {
  if ('serviceWorker' in navigator) {
    if (navigator.serviceWorker.controller) offlineState = 'ready'; // already installed (e.g. opened with no signal)
    navigator.serviceWorker.register('sw.js')
      .then(() => navigator.serviceWorker.ready)
      .then(() => { offlineState = 'ready'; updateOfflineStatus(); })
      .catch(() => navigator.serviceWorker.getRegistration().then(reg => {
        offlineState = (reg && reg.active) || navigator.serviceWorker.controller ? 'ready' : 'none'; updateOfflineStatus();
      }));
  } else offlineState = 'none';
}
// Ask the browser not to clear saved data when the device is low on space.
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

db.trials.forEach(stampOwn); // assessments from before signatures existed were made on this device
render();
</script>
