    setSignature({ id: uid(), png: out.toDataURL('image/png'), gray: bytesB64(gray), w, h, created: Date.now() });
    ov.remove(); toast('Signature saved'); onDone();
  };
}

function openExport(t, a) {
  const ov = document.createElement('div'); ov.className = 'modal';
  ov.innerHTML = `<div class="sheet"><h2>Export ${a ? esc(dmy(a.date)) + ' Assessment' : 'All Assessments'}</h2>
    <button class="primary" data-k="xlsx">Excel (.xlsx)</button><button class="primary" data-k="pdf">PDF</button><button class="primary" data-k="both">PDF and Excel</button><button data-k="x">Cancel</button></div>`;
  document.body.appendChild(ov);
  ov.onclick = e => {
    const k = e.target.dataset && e.target.dataset.k;
    if (e.target === ov || k === 'x') { ov.remove(); return; }
    if (!k) return;
    ov.remove();
    try {
      const files = [];
      if (k === 'pdf' || k === 'both') files.push(pdfFile(t, a ? [a] : t.assessments));
      if (k === 'xlsx' || k === 'both') files.push(excelFile(t, a));
      downloadMany(files); toast(files.length > 1 ? 'PDF and Excel exported' : files[0].name.endsWith('.pdf') ? 'PDF exported' : 'Excel file exported');
    } catch (err) { alert('Sorry, the export failed: ' + err.message); }
  };
}
function downloadMany(files) {
  try {
    const fs = files.map(f => new File([f.blob], f.name, { type: f.blob.type }));
    if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files: fs })) {
      navigator.share({ files: fs, title: fs[0].name }).catch(err => { if (err && err.name !== 'AbortError') files.forEach(f => saveLink(f.blob, f.name)); });
      return;
    }
  } catch (e) {}
  files.forEach((f, i) => setTimeout(() => saveLink(f.blob, f.name), i * 500));
}

function download(blob, name) {
  // On phones/tablets, open the share menu (Save to Files, email, Drive…), which works inside installed apps.
  try {
    const file = new File([blob], name, { type: blob.type });
    if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).catch(err => { if (err && err.name !== 'AbortError') saveLink(blob, name); });
      return;
    }
  } catch (e) {}
  saveLink(blob, name);
}
function saveLink(blob, name) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a'); link.href = url; link.download = name;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function colName(c) { let s = ''; c++; while (c > 0) { const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = Math.floor((c - 1) / 26); } return s; }
const xmlEsc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');

function sheetXml(sh, withDrawing) {
  const widths = [];
  sh.rows.forEach(row => row.forEach((c, i) => {
    const v = c && typeof c === 'object' ? c.v : c; const len = v == null ? 0 : String(v).length;
    widths[i] = Math.max(widths[i] || 6, Math.min(45, len + 2));
  }));
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">';
  if (sh.freeze) { const fr = sh.freeze === true ? 1 : +sh.freeze; x += `<sheetViews><sheetView workbookViewId="0"><pane ySplit="${fr}" topLeftCell="A${fr + 1}" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`; }
  if (widths.length) x += '<cols>' + widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w || 8}" customWidth="1"/>`).join('') + '</cols>';
  x += '<sheetData>';
  sh.rows.forEach((row, r) => {
    x += `<row r="${r + 1}">`;
    row.forEach((c, i) => {
      let v = c, bold = false;
      if (c && typeof c === 'object') { v = c.v; bold = !!c.b; }
      if (v == null || v === '') return;
      const ref = colName(i) + (r + 1); const s = bold ? ' s="1"' : '';
      if (typeof v === 'number' && isFinite(v)) x += `<c r="${ref}"${s}><v>${v}</v></c>`;
      else x += `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    });
    x += '</row>';

}
const b64Bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

function buildXlsx(sheets, sig) {
  const used = new Set();
  sheets.forEach(sh => { let n = sh.name.replace(/[\[\]:*?\/\\]/g, '').slice(0, 31) || 'Sheet'; let i = 2; while (used.has(n.toLowerCase())) n = n.slice(0, 28) + ' ' + i++; used.add(n.toLowerCase()); sh.name = n; });

    let h = 36, w = Math.round(h * sig.w / sig.h); if (w > 160) { w = 160; h = Math.round(w * sig.h / sig.w); } sigPx = { w, h };
    sheets.forEach(sh => {
      const ncols = Math.max(0, ...sh.rows.map(r => r.length)); if (!sh.rows.length) sh.rows.push([]);
      const r0 = sh.rows[0]; while (r0.length < ncols + 1) r0.push(null); r0[ncols + 1] = { v: 'Signed:', b: true }; sh.sigCol = ncols + 2;
    });
  }

    { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}/spreadsheetml/2006/main" xmlns:r="${NS}/officeDocument/2006/relationships"><sheets>${sheets.map((sh, i) => `<sheet name="${xmlEsc(sh.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="${NS}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="${NS}/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { name: 'xl/styles.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
    ...sheets.map((sh, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: sheetXml(sh, !!sig) })),

  if (sig) {

    sheets.forEach((sh, i) => {
      files.push({ name: `xl/worksheets/_rels/sheet${i + 1}.xml.rels`, data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/drawing" Target="../drawings/drawing${i + 1}.xml"/></Relationships>` });
      files.push({ name: `xl/drawings/_rels/drawing${i + 1}.xml.rels`, data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/image" Target="../media/image1.png"/></Relationships>` });
      const cx = sigPx.w * 9525, cy = sigPx.h * 9525;
      files.push({ name: `xl/drawings/drawing${i + 1}.xml`, data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><xdr:wsDr xmlns:xdr="${NS}/drawingml/2006/spreadsheetDrawing" xmlns:a="${NS}/drawingml/2006/main"><xdr:oneCellAnchor><xdr:from><xdr:col>${sh.sigCol}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>0</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from><xdr:ext cx="${cx}" cy="${cy}"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="2" name="Signature"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip xmlns:r="${NS}/officeDocument/2006/relationships" r:embed="rId1"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor></xdr:wsDr>` });
    });

const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

function zipStore(files, type) { // uncompressed ZIP — valid for .xlsx
  const enc = new TextEncoder(); const parts = [], central = []; let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name), data = f.data instanceof Uint8Array ? f.data : enc.encode(f.data), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  });
  const size = central.reduce((s, p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, size, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type });
}

/* ---------- app version ---------- */
function showVersion() {
  const el = document.getElementById('app-ver'); if (!el) return;
  const base = `App version ${APP_VERSION} · Last updated ${fmtDT(appInfo.installedAt)}${appInfo.checkedAt ? ` · Last checked ${fmtDT(appInfo.checkedAt)}` : ''}`;
  el.textContent = base;
  if (window.caches) caches.keys().then(keys => {
    const newest = Math.max(0, ...keys.filter(k => k.startsWith('field-assessments-v')).map(k => parseInt(k.split('-v')[1], 10) || 0));
    if (newest > APP_VERSION && document.getElementById('app-ver')) document.getElementById('app-ver').textContent = base + ` · Version ${newest} has been downloaded – close and reopen the app to use it`;
  }).catch(() => {});
}
async function checkForUpdates() { // asks the web address for a newer copy of the app and installs it
  const msg = document.getElementById('upd-msg'), say = t => { if (msg) msg.textContent = t; };
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') { say('Updates can only be checked when the app is opened from its web address.'); return; }
  say('Checking…');
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) { say('The app is not set up for offline use on this device yet – reload it once with internet.'); return; }
    let found = false; const onFound = () => { found = true; };
    reg.addEventListener('updatefound', onFound);
    await reg.update(); await new Promise(r => setTimeout(r, 1500));
    reg.removeEventListener('updatefound', onFound);
    appInfo.checkedAt = Date.now(); try { localStorage.setItem(APPINFO_KEY, JSON.stringify(appInfo)); } catch (e) {}
    if (found || reg.installing || reg.waiting) {
      say('New version found – installing…');
      await new Promise(res => { const t = setTimeout(res, 6000); navigator.serviceWorker.addEventListener('controllerchange', () => { clearTimeout(t); res(); }, { once: true }); });
      location.reload();
    } else { say(`You're up to date (version ${APP_VERSION}).`); showVersion(); }
  } catch (e) { say("Couldn't check – no connection to the app's web address."); }
}

/* ---------- offline install ---------- */
let offlineState = location.protocol === 'file:' ? 'file' : 'checking';
function updateOfflineStatus() {
  const el = document.getElementById('offline-status'); if (!el) return;
  const msg = {
    file: '✓ Running from a file on this device. Works without internet.',
    ready: '✓ Ready to work offline. No internet needed from now on.',
    checking: 'Saving the app to this device for offline use…',
    none: '⚠ This browser can’t save the app for offline use. Open it in Safari (iPhone/iPad) or Chrome.',
  }[offlineState];
  el.textContent = msg;
  el.className = 'small ' + (offlineState === 'ready' || offlineState === 'file' ? 'rep-ok' : offlineState === 'none' ? 'rep-bad' : 'muted');
}
if (location.protocol.startsWith('http')) {
  if ('serviceWorker' in navigator) {
    if (navigator.serviceWorker.controller) offlineState = 'ready'; // already installed (e.g. opened with no signal)
    navigator.serviceWorker.register('sw.js')
      .then(() => navigator.serviceWorker.ready)
      .then(() => { offlineState = 'ready'; updateOfflineStatus(); })
      .catch(() => navigator.serviceWorker.getRegistration().then(reg => {
        offlineState = (reg && reg.active) || navigator.serviceWorker.controller ? 'ready' : 'none'; updateOfflineStatus();
      }));
  } else offlineState = 'none';
}

try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
